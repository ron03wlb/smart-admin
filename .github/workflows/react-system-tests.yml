name: React System Module Tests

on:
  pull_request:
    paths:
      - 'smart-admin-web-react/src/views/system/**'
      - 'smart-admin-web-react/src/api/system/**'
      - 'smart-admin-web-react/src/test/**'
      - 'smart-admin-web-react/package.json'
      - 'smart-admin-web-react/vite.config.ts'
      - 'smart-admin-web-react/vitest.config.ts'
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'smart-admin-web-react/src/views/system/**'
      - 'smart-admin-web-react/src/api/system/**'
      - 'smart-admin-web-react/src/test/**'
      - 'smart-admin-web-react/package.json'
      - 'smart-admin-web-react/vite.config.ts'
      - 'smart-admin-web-react/vitest.config.ts'

jobs:
  # System Module Tests (100% pass rate - 64/64)
  test-system-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-admin-web-react
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-admin-web-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run System module tests
        run: npm run test -- src/views/system
        env:
          CI: true

      - name: Test Summary
        if: always()
        run: |
          echo "📊 System Module Test Summary"
          echo "=============================="
          echo "✅ Role module: 100%"
          echo "✅ All System module tests passing"
          echo ""
          echo "Overall Pass Rate: 100% (64/64 tests passing)"
