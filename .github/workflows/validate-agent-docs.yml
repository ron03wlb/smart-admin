name: Validate .agent Documentation

on:
  pull_request:
    paths:
      - '.agent/rules/**'
      - '.agent/workflows/**'
      - '.agent/README.md'
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - '.agent/rules/**'
      - '.agent/workflows/**'

jobs:
  validate-docs:
    name: Validate .agent Documentation Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Changed Files
        run: |
          echo "📋 Validating .agent documentation files..."

          # 查找所有需要驗證的文件
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: 只驗證變更的文件
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.agent/(rules|workflows)/.*\.md$' || true)
          else
            # Push: 驗證所有文件
            CHANGED_FILES=$(find .agent/rules .agent/workflows -name '*.md' -type f)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No .agent documentation files changed"
            exit 0
          fi

          echo "Files to validate:"
          echo "$CHANGED_FILES"

          # 運行驗證腳本
          chmod +x .agent/scripts/validate-rule.sh

          FAILED=0
          for file in $CHANGED_FILES; do
            echo ""
            echo "🔍 Validating: $file"
            if ./.agent/scripts/validate-rule.sh "$file"; then
              echo "✅ $file passed"
            else
              echo "❌ $file failed"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ $FAILED file(s) failed validation"
            exit 1
          fi

          echo ""
          echo "✅ All files passed validation"

      - name: Check File Sizes
        run: |
          echo "📏 Checking file sizes (limit: 11000 characters)..."

          OVERSIZED=0
          for file in .agent/rules/*.md .agent/workflows/*.md; do
            if [ -f "$file" ]; then
              SIZE=$(wc -c < "$file" | tr -d ' ')
              # 00-ai-decision-matrix.md 和 00-workflow-index.md 豁免
              if [[ "$file" =~ 00-(ai-decision-matrix|workflow-index)\.md$ ]]; then
                echo "⚠️  $file: $SIZE bytes (索引文件，豁免檢查)"
                continue
              fi

              if [ "$SIZE" -gt 11000 ]; then
                echo "❌ $file: $SIZE bytes (超過限制)"
                OVERSIZED=$((OVERSIZED + 1))
              else
                echo "✅ $file: $SIZE bytes"
              fi
            fi
          done

          if [ $OVERSIZED -gt 0 ]; then
            echo ""
            echo "❌ $OVERSIZED file(s) exceed size limit"
            echo "💡 建議: 將內容拆分為多個文件"
            exit 1
          fi

          echo ""
          echo "✅ All files within size limit"

      - name: Validate Front Matter
        run: |
          echo "📄 Validating front matter format..."

          FAILED=0
          for file in .agent/rules/*.md .agent/workflows/*.md; do
            if [ -f "$file" ]; then
              # 檢查 front matter 開始標記
              if ! head -n 1 "$file" | grep -q "^---$"; then
                echo "❌ $file: Missing front matter opening (---)"
                FAILED=$((FAILED + 1))
                continue
              fi

              # 檢查 trigger 字段
              if ! grep -q "^trigger:" "$file"; then
                echo "❌ $file: Missing 'trigger' field"
                FAILED=$((FAILED + 1))
              fi

              # 檢查 description 字段
              if ! grep -q "^description:" "$file"; then
                echo "❌ $file: Missing 'description' field"
                FAILED=$((FAILED + 1))
              fi

              # 檢查 last_updated 字段
              if ! grep -q "^last_updated:" "$file"; then
                echo "❌ $file: Missing 'last_updated' field"
                FAILED=$((FAILED + 1))
              fi

              # 如果是 rules 文件，檢查 ai_role
              if [[ "$file" =~ \.agent/rules/.*\.md$ ]]; then
                if ! grep -q "^ai_role:" "$file"; then
                  echo "❌ $file: Missing 'ai_role' field (required for rules)"
                  FAILED=$((FAILED + 1))
                fi
              fi
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ $FAILED validation error(s) found"
            exit 1
          fi

          echo "✅ All front matter valid"

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ## ⚠️ .agent 文檔驗證失敗

            您的 PR 中的 \`.agent\` 文檔未通過格式驗證。

            **常見問題**:
            - 缺少必填的 front matter 字段（trigger, description, last_updated）
            - Rules 文件缺少 \`ai_role\` 字段
            - 文件大小超過 11000 字符限制
            - 缺少 AI 指令區塊（\`## 🤖 AI 指令區塊\`）

            **修復方法**:
            1. 本地運行驗證腳本:
               \`\`\`bash
               ./.agent/scripts/validate-rule.sh <file-path>
               \`\`\`

            2. 查看詳細錯誤信息，修復後重新推送

            3. 參考文檔: [.agent/README.md](../.agent/README.md#規則文件格式規範-v20)

            **檢查日誌**: 請查看上方的 CI 日誌了解具體錯誤
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Comment on PR (if passed)
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ .agent 文檔格式驗證通過！所有文件符合規範。'
            });
