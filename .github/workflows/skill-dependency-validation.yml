name: Skill Dependency Validation

on:
  pull_request:
    paths:
      - '.claude/skills/skill-registry.yml'
      - '.claude/skills/*/config.yml'
  push:
    branches:
      - master
      - main
      - develop

jobs:
  validate-dependencies:
    name: Validate Skill Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate dependency graph
        run: |
          python3 .claude/scripts/validate-dependency-graph.py
          if [ $? -ne 0 ]; then
            echo "❌ Dependency graph validation FAILED"
            echo "Please fix errors and run validation locally:"
            echo "  python3 .claude/scripts/validate-dependency-graph.py"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ Skill dependency graph is valid"
          echo "✅ No circular dependencies detected"
          echo "✅ All skill references are correct"
