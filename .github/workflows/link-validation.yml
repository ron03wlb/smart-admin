name: Link Validation

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - '.claude/skills/**/*.md'
  push:
    branches:
      - master
    paths:
      - 'docs/**/*.md'
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 2:00 AM UTC

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate internal links
        run: |
          BROKEN_LINKS=0

          echo "🔍 掃描文檔內部鏈接..."

          for file in $(find docs/iGaming -name "*.md"); do
            while IFS= read -r link; do
              # Ignore external URLs and anchors
              if [[ $link == http* ]] || [[ $link == \#* ]]; then
                continue
              fi

              # Remove anchor
              link="${link%%#*}"

              # Resolve relative path
              dir=$(dirname "$file")
              target="$dir/$link"

              # Check if file exists
              if [[ ! -f "$target" ]]; then
                echo "❌ 斷裂鏈接: $file -> $link"
                BROKEN_LINKS=$((BROKEN_LINKS + 1))
              fi
            done < <(grep -oP '\[.*?\]\(\K[^)]+' "$file" 2>/dev/null || true)
          done

          if [ $BROKEN_LINKS -eq 0 ]; then
            echo "✅ 所有鏈接有效"
            exit 0
          else
            echo "❌ 發現 $BROKEN_LINKS 個斷裂鏈接"
            echo ""
            echo "建議: 檢查文件移動或重命名後是否更新了所有引用"
            echo "修復工具: 運行 ./scripts/validate_links.ps1 查看詳細信息"
            exit 1
          fi
