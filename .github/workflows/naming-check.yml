# ====================================================================
# SmartAdmin Naming Convention Check Workflow
# ====================================================================
# Purpose: Automatically validate Entity @TableName annotations follow
#          singular naming standard on every pull request
# Version: 1.0.0
# Last Updated: 2026-02-02
# ====================================================================

name: Naming Convention Check

on:
  pull_request:
    paths:
      - '**/entity/*.java'
      - '**/domain/entity/**/*.java'
      - '**/Entity.java'
    types:
      - opened
      - synchronize
      - reopened

  # Allow manual trigger
  workflow_dispatch:

jobs:
  naming-validation:
    name: Validate Table Naming Convention
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ====================================================================
      # Step 1: Checkout Code
      # ====================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comprehensive analysis

      # ====================================================================
      # Step 2: Setup Java Environment
      # ====================================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # ====================================================================
      # Step 3: Quick Grep Check (Fast Fail)
      # ====================================================================
      - name: Quick Plural Detection (Fast Fail)
        id: quick_check
        run: |
          echo "Scanning for potential plural table names..."

          # Find Entity files
          entity_files=$(find . -type f -name '*Entity.java' \
            -not -path '*/build/*' \
            -not -path '*/target/*' \
            -not -path '*/node_modules/*')

          # Check for common plural patterns (fast check)
          violations=$(echo "$entity_files" | xargs grep -l '@TableName.*\(users\|orders\|goods\|players\|wallets\|transactions\|bonuses\|games\|activities\|agents\|tenants\|brands\)"' || true)

          if [ -n "$violations" ]; then
            echo "❌ Potential plural table names detected:"
            echo "$violations"
            echo "has_violations=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No obvious plural patterns detected"
            echo "has_violations=false" >> $GITHUB_OUTPUT
          fi

      # ====================================================================
      # Step 4: Run ArchUnit Tests (Comprehensive Check)
      # ====================================================================
      - name: Run ArchUnit Naming Tests
        id: archunit_test
        working-directory: ./smart-admin-api-java21-springboot3
        run: |
          echo "Running ArchUnit tableNameMustBeSingular test..."
          ./gradlew :sa-admin:test \
            --tests ArchitectureTest#tableNameMustBeSingular \
            --info \
            --stacktrace
        continue-on-error: true

      # ====================================================================
      # Step 5: Generate Violation Report
      # ====================================================================
      - name: Generate Violation Report
        if: steps.archunit_test.outcome == 'failure'
        run: |
          mkdir -p docs/quality

          cat > docs/quality/NAMING-VIOLATIONS-REPORT.md <<'EOF'
          # Naming Convention Violation Report (CI/CD)

          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run**: ${{ github.run_number }}
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.head_ref }}

          ---

          ## ❌ Violations Detected

          ArchUnit test `tableNameMustBeSingular` **FAILED**.

          Please check the following:
          1. Review Entity classes in the PR
          2. Ensure all @TableName annotations use singular form
          3. Verify exemptions (metrics, statistics, analytics) are intentional

          ---

          ## 📋 Fix Instructions

          ### Step 1: Identify Violations

          Run ArchUnit test locally:
          ```bash
          cd smart-admin-api-java21-springboot3
          ./gradlew :sa-admin:test --tests ArchitectureTest#tableNameMustBeSingular
          ```

          ### Step 2: Fix Table Names

          Update Entity @TableName annotations:
          ```java
          // ❌ Before
          @TableName("t_goods")
          public class GoodsEntity { }

          // ✅ After
          @TableName("t_good")
          public class GoodsEntity { }
          ```

          ### Step 3: Update Database (if needed)

          Create Flyway migration script:
          ```sql
          -- V1.x__rename_xxx_table.sql
          ALTER TABLE t_goods RENAME TO t_good;
          ```

          ### Step 4: Update Mapper XML

          Batch replace table names in Mapper.xml files:
          ```xml
          <!-- Replace all occurrences -->
          <select id="query">
              SELECT * FROM t_good  <!-- Changed from t_goods -->
              ...
          </select>
          ```

          ---

          ## 📚 References

          - [Naming Conventions](.agent/rules/foundation/01-naming-conventions.md) - Section 7
          - [ADR-001: Singular Standard](docs/IGaming/architecture-decisions/ADR-001-Naming-Convention-Singular-Standard.md)

          EOF

      # ====================================================================
      # Step 6: Upload Artifact (if violations found)
      # ====================================================================
      - name: Upload Violation Report
        if: steps.archunit_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: naming-violations-report
          path: docs/quality/NAMING-VIOLATIONS-REPORT.md
          retention-days: 30

      # ====================================================================
      # Step 7: Comment on PR (if violations found)
      # ====================================================================
      - name: Comment on PR with Violations
        if: steps.archunit_test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'docs/quality/NAMING-VIOLATIONS-REPORT.md';

            let reportContent = '# ❌ Naming Convention Violations Detected\n\n';
            reportContent += 'ArchUnit test `tableNameMustBeSingular` failed.\n\n';
            reportContent += '## Quick Fix Guide\n\n';
            reportContent += '1. Update Entity `@TableName` annotations to use singular form\n';
            reportContent += '2. Create database migration script if needed\n';
            reportContent += '3. Update Mapper XML files\n';
            reportContent += '4. Run tests: `./gradlew :sa-admin:test --tests ArchitectureTest#tableNameMustBeSingular`\n\n';
            reportContent += '## References\n\n';
            reportContent += '- [Naming Conventions](.agent/rules/foundation/01-naming-conventions.md#7-table-naming-exemption-list)\n';
            reportContent += '- [ADR-001](docs/IGaming/architecture-decisions/ADR-001-Naming-Convention-Singular-Standard.md)\n\n';
            reportContent += '---\n\n';
            reportContent += '📥 [Download Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent
            });

      # ====================================================================
      # Step 8: Fail Job if Violations Found
      # ====================================================================
      - name: Fail Job if Violations Found
        if: steps.archunit_test.outcome == 'failure'
        run: |
          echo "❌ Naming convention violations detected. Please fix before merging."
          exit 1

      # ====================================================================
      # Step 9: Success Summary
      # ====================================================================
      - name: Success Summary
        if: steps.archunit_test.outcome == 'success'
        run: |
          echo "✅ All Entity @TableName annotations follow singular naming standard"
          echo "✅ ArchUnit test passed"
          echo "✅ Ready to merge"

