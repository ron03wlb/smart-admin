name: Skill Registry Sync Validation

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.agent/skills/**'
      - 'scripts/sync-skill-registries.py'
  push:
    branches:
      - master
      - main
      - develop

jobs:
  validate-sync:
    name: Validate .claude/ ↔ .agent/ Skill Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skill registry sync
        run: |
          echo "🔄 Validating .claude/skills/ ↔ .agent/skills/ sync..."
          python3 scripts/sync-skill-registries.py --check
          if [ $? -ne 0 ]; then
            echo ""
            echo "❌ Skill registry sync validation FAILED"
            echo ""
            echo "Please run the sync script locally to identify issues:"
            echo "  python3 scripts/sync-skill-registries.py"
            echo ""
            echo "Common fixes:"
            echo "  1. Add missing skills to .agent/skills/"
            echo "  2. Update priority/path in both registries"
            echo "  3. Create SKILL.md files for new skills"
            exit 1
          fi

      - name: Validate .claude/skills structure
        run: |
          echo "📁 Validating .claude/skills/ structure..."

          # Check skill-registry.yml exists
          if [ ! -f ".claude/skills/skill-registry.yml" ]; then
            echo "❌ .claude/skills/skill-registry.yml not found"
            exit 1
          fi

          # Count skills with config.yml
          config_count=$(find .claude/skills -name "config.yml" -type f | wc -l)
          echo "✅ Found $config_count skills with config.yml"

          # Count skills with SKILL.md
          skill_md_count=$(find .claude/skills -name "SKILL.md" -type f | wc -l)
          echo "✅ Found $skill_md_count skills with SKILL.md"

          # Warn if counts don't match
          if [ "$config_count" -ne "$skill_md_count" ]; then
            echo "⚠️  Warning: config.yml count ($config_count) ≠ SKILL.md count ($skill_md_count)"
          fi

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "✅ Skill registry sync validation PASSED"
          echo "✅ .claude/skills/ and .agent/skills/ are synchronized"
          echo "✅ All skill structures are valid"
