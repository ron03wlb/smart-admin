# Kafka Test Configuration
# 用于 mq 模块的单元测试和集成测试

# 日志配置
logging:
  level:
    root: WARN
    net.lab1024.sa.common.mq.kafka: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

# Spring Kafka 测试配置
spring:
  kafka:
    # EmbeddedKafka 会自动注入 bootstrap-servers
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: test-group
    producer:
      acks: all
      retries: 3
    listener:
      ack-mode: manual_immediate

# SmartAdmin Kafka 配置（用于配置类测试）
smart:
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
      max-in-flight-requests-per-connection: 1
      batch-size: 16384
      buffer-memory: 33554432
      linger-ms: 5
    consumer:
      group-id: test-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
      max-poll-interval-ms: 300000
      session-timeout-ms: 45000
      heartbeat-interval-ms: 3000
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 1
    dead-letter-queue:
      enabled: true
      topic-suffix: .dlq
      retry:
        max-attempts: 3
        initial-interval: 100
        max-interval: 1000
        multiplier: 2.0
    batch:
      enabled: true
      size: 10
      concurrency: 1
      aggregate:
        enabled: true
        count: 5
        timeout-ms: 500
