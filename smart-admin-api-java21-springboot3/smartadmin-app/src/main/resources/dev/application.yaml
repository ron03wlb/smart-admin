# 多租戶配置
tenant:
  enabled: false
  default-timezone: UTC
  base-domain: example.com
  rls:
    enabled: false  # Enable after switching datasource to smartadmin_app

# JetCache 二級緩存配置
jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
      expireAfterWriteInMillis: 1800000  # 30 分鐘
  remote:
    default:
      type: redis.lettuce
      keyConvertor: fastjson2
      valueEncoder: java
      valueDecoder: java
      expireAfterWriteInMillis: 7200000  # 2 小時
      uri: redis://${spring.data.redis.host:localhost}:${spring.data.redis.port:6379}/${spring.data.redis.database:1}

# Resilience4j 斷路器配置（iGaming PSP/GP 外部呼叫保護）
resilience4j:
  circuitbreaker:
    configs:
      pspDefault:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
      gpDefault:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
  retry:
    configs:
      pspDefault:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# Logging 配置（診斷 TypeHandler 註冊問題）
logging:
  level:
    root: INFO
    org.apache.ibatis: DEBUG
    org.mybatis.spring: DEBUG
    net.lab1024.sa.common.mybatis.typehandler: DEBUG
