# SmartAdmin iGaming Activity - Test Configuration
#
# This configuration is used by integration tests with @ActiveProfiles("test").
# Database connection properties are dynamically overridden by Testcontainers via @DynamicPropertySource.

spring:
  application:
    name: smartadmin-igaming-activity-test

  # Datasource (overridden by Testcontainers)
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

  # Flyway migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

  # JPA/Hibernate (disabled - using MyBatis Plus)
  jpa:
    hibernate:
      ddl-auto: none

  # Kafka (disabled for tests)
  kafka:
    enabled: false

  # Redis (use embedded Redis for tests if needed, or disable)
  redis:
    enabled: false

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# LiteFlow
liteflow:
  enable: true
  rule-source-ext-data:
    # Use database rule source for tests
    data-source: postgres
  print-banner: false

# Logging
logging:
  level:
    root: INFO
    net.lab1024.sa: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.springframework.test: DEBUG
