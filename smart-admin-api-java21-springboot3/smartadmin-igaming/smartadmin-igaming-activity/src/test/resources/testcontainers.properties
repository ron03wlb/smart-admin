# Testcontainers Configuration
#
# Enable container reuse across test runs to speed up test execution.
# Containers are started once and reused until explicitly removed.
#
# WARNING: Reused containers persist between test runs. Remember to clean up manually if needed:
# docker ps -a | grep testcontainers
# docker rm -f $(docker ps -aq --filter "label=org.testcontainers=true")

testcontainers.reuse.enable=true
