# Testcontainers Configuration for iGaming Integration Tests
#
# This configuration enables container reuse across test classes to improve test performance
# and ensure consistent database state across all integration tests.
#
# Key Benefits:
# - Containers are started once and reused across all test classes
# - Prevents port conflicts when containers restart
# - Reduces test execution time (no container restart overhead)
# - Ensures consistent JDBC URL across test classes
#
# Container Lifecycle:
# - Containers start before first test class execution
# - Containers are reused by all test classes (BaseIntegrationTest subclasses)
# - Containers stop only when JVM terminates
#
# Important Notes:
# - Requires Docker daemon to be running
# - Container state (data) is preserved across test classes
# - Use @BeforeEach cleanup in BaseIntegrationTest to ensure test isolation
#
# Configuration Reference:
# https://java.testcontainers.org/features/reuse/

# Enable container reuse across test classes (CRITICAL FIX for port consistency)
testcontainers.reuse.enable=true

# Disable Ryuk resource cleanup (allows containers to stay running)
# Note: Manual cleanup required when stopping development
testcontainers.ryuk.disabled=false
