# Test environment configuration
project:
  name: sa-admin
  log-directory: ${java.io.tmpdir}/smart_admin_v3/${project.name}/test

server:
  port: 0
  servlet:
    context-path: /

spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never

# Disable features not needed in tests
sa-token:
  token-name: x-access-token
  timeout: 3600
  is-concurrent: true
  is-share: false
  is-print: false

logging:
  config: classpath:log4j2-spring.xml
