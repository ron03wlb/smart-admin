# ====================================================================
# Spring Pattern Checker - Skill Configuration
# ====================================================================
# Version: 1.0.0
# Priority: P1 (Extended/Quality)
# Type: Atomic
# Category: Quality
# ====================================================================

metadata:
  name: "spring-pattern-checker"
  version: "1.0.0"
  priority: "P1"
  type: "atomic"
  category: "quality"
  visibility: "public"
  preferred_via: "agent_only"
  status: "stable"
  description: |
    SmartAdmin Spring Pattern Checker - Validates code compliance with SmartAdmin's
    Spring-specific conventions including @Transactional placement, dependency injection,
    layered architecture calls, and Spring Bean naming.

    Core capabilities:
    1. Validate @Transactional placement (Manager layer only)
    2. Check dependency injection patterns (constructor injection required)
    3. Verify layered architecture calls (Controller → Service → Manager → Dao)
    4. Validate Spring Bean naming conventions
    5. Check @Cacheable annotation placement
    6. Detect field injection anti-patterns

  ai_description: |
    Enforces SmartAdmin's Spring-specific architectural rules through static analysis.
    Catches violations before they reach ArchUnit tests.

  tags:
    - spring
    - architecture
    - validation
    - smartadmin
    - dependency-injection
    - transactional

  author: "SmartAdmin Team"
  last_updated: "2026-01-30"

# ====================================================================
# Trigger Configuration
# ====================================================================
triggers:
  keywords:
    - "spring pattern"
    - "transactional placement"
    - "dependency injection"
    - "spring validation"
    - "architecture compliance"
  patterns:
    - "check spring.*patterns"
    - "validate.*architecture"
  exclude_keywords: []

# ====================================================================
# Execution Configuration
# ====================================================================
execution:
  type: "agent-delegated"
  timeout:
    per_phase_minutes: 10
    total_minutes: 10
  quality_gates:
    run_after_execution: false

# ====================================================================
# Dependencies
# ====================================================================
dependencies:
  skills: []
  required_files:
    - ".agent/rules/foundation/10-architecture-rules.md"
    - ".agent/configs/ArchitectureTest.java"
  tools:
    - "JavaParser"
    - "ArchUnit"

# ====================================================================
# Output
# ====================================================================
output:
  generates:
    - "*.md"
  target_directories:
    - "docs/quality"
  templates: {}

# ====================================================================
# Validation
# ====================================================================
validation:
  pre_execution:
    - check: "codebase_structure"
  post_execution: []

# ====================================================================
# Compatibility
# ====================================================================
compatibility:
  deprecated: false
  replacement_skill: null
  migration_date: null

# ====================================================================
# Documentation
# ====================================================================
documentation:
  skill_md: "SKILL.md"
  readme: "README.md"

# ====================================================================
# Monitoring
# ====================================================================
monitoring:
  track_usage: true
  log_executions: true
  metrics:
    - execution_time
    - violations_found
