# ====================================================================
# Naming Convention Checker - Skill Configuration
# ====================================================================
# Version: 1.0.0
# Priority: P1 (Extended/Quality)
# Type: Atomic
# Category: Quality
# ====================================================================

metadata:
  name: "naming-convention-checker"
  version: "1.0.0"
  priority: "P1"
  type: "atomic"
  category: "quality"
  visibility: "public"
  preferred_via: "agent_only"
  status: "stable"
  description: |
    SmartAdmin Naming Convention Checker - Validates code compliance with SmartAdmin's
    naming standards, specifically focusing on Entity @TableName annotations to ensure
    all table names use singular form (except exempted cases).

    Core capabilities:
    1. Scan Entity classes for @TableName annotations
    2. Detect plural table names (users, orders, goods, players, wallets, etc.)
    3. Validate against exemption list (metrics, statistics, analytics)
    4. Generate violation reports with recommended fixes
    5. Support custom plural patterns configuration
    6. Integrate with ArchUnit tests for automated checks

  ai_description: |
    Enforces SmartAdmin's singular naming standard for database tables through static
    analysis. Prevents plural table names from being introduced to the codebase.

  tags:
    - naming
    - conventions
    - validation
    - smartadmin
    - entity
    - table-name
    - singular-standard

  author: "SmartAdmin Team"
  last_updated: "2026-02-02"

# ====================================================================
# Trigger Configuration
# ====================================================================
triggers:
  keywords:
    - "naming convention"
    - "table name"
    - "singular standard"
    - "naming validation"
    - "entity naming"
  patterns:
    - "check naming.*conventions"
    - "validate.*table.*names"
    - "scan.*entity.*naming"
  exclude_keywords: []

# ====================================================================
# Execution Configuration
# ====================================================================
execution:
  type: "agent-delegated"
  timeout:
    per_phase_minutes: 5
    total_minutes: 5
  quality_gates:
    run_after_execution: false

# ====================================================================
# Dependencies
# ====================================================================
dependencies:
  skills: []
  required_files:
    - ".agent/rules/foundation/F01-naming-conventions.md"
    - ".agent/configs/ArchitectureTest.java"
    - "docs/IGaming/architecture-decisions/ADR-001-Naming-Convention-Singular-Standard.md"
  tools:
    - "JavaParser"
    - "ArchUnit"
    - "Grep"

# ====================================================================
# Output
# ====================================================================
output:
  generates:
    - "NAMING-VIOLATIONS-REPORT.md"
  target_directories:
    - "docs/quality"
  templates: {}

# ====================================================================
# Validation
# ====================================================================
validation:
  pre_execution:
    - check: "codebase_structure"
    - check: "required_files_exist"
  post_execution:
    - check: "report_generated"

# ====================================================================
# Compatibility
# ====================================================================
compatibility:
  deprecated: false
  replacement_skill: null
  migration_date: null

# ====================================================================
# Documentation
# ====================================================================
documentation:
  skill_md: "SKILL.md"
  readme: "README.md"

# ====================================================================
# Monitoring
# ====================================================================
monitoring:
  track_usage: true
  log_executions: true
  metrics:
    - execution_time
    - violations_found
    - entities_scanned
