# ====================================================================
# Concurrency Safety Auditor Skill Configuration
# ====================================================================
# Version: 1.0.0
# Created: 2026-01-29
# Priority: P1 (Extended/Quality)
# Type: Atomic
# Category: Quality
# ====================================================================

metadata:
  name: "concurrency-safety-auditor"
  version: "1.0.0"
  priority: "P1"
  type: "atomic"
  category: "quality"
  visibility: "public"
  preferred_via: "user_invoked"
  status: "stable"

  description: |
    Comprehensive concurrency safety audit with SpotBugs-based pattern detection
    and risk rating system (⭐⭐⭐⭐⭐ scale).

    Capabilities:
    1. Detect 8 concurrency patterns (check-then-act, double-checked locking, etc.)
    2. Risk assessment: Probability × Impact × Actual Harm
    3. Generate fix recommendations with code examples
    4. Integration with SmartAdmin quality gates

    Output: Detailed audit report with prioritized action items

  aliases:
    - "concurrency-audit"
    - "thread-safety-check"
    - "race-condition-detection"
    - "concurrency-analysis"

  tags:
    - concurrency
    - thread-safety
    - race-condition
    - spotbugs
    - quality
    - audit

# ====================================================================
# Trigger Configuration
# ====================================================================
triggers:
  keywords:
    - "concurrency"
    - "thread safety"
    - "race condition"
    - "deadlock detection"
    - "concurrent access"
    - "synchronization issues"
    - "thread-safe audit"

  patterns:
    - "analyze concurrency"
    - "check thread safety"
    - "audit concurrent code"
    - "detect race conditions"

# ====================================================================
# Execution Configuration
# ====================================================================
execution:
  type: "single-shot"
  timeout_minutes: 15
  requires_confirmation: true

  phases:
    - id: "phase-1-spotbugs-scan"
      name: "SpotBugs Concurrency Scan"
      description: "Run SpotBugs with custom concurrency detectors"
      output: "Raw SpotBugs report (XML)"

    - id: "phase-2-pattern-analysis"
      name: "Pattern Analysis"
      description: "Identify concurrency patterns and anti-patterns"
      output: "Categorized pattern list (8 types)"

    - id: "phase-3-risk-assessment"
      name: "Risk Assessment"
      description: "Calculate risk rating (⭐⭐⭐⭐⭐ scale)"
      output: "Risk scores for each issue"

    - id: "phase-4-fix-recommendations"
      name: "Fix Recommendations"
      description: "Generate code-level fix suggestions"
      output: "Recommended code changes"

# ====================================================================
# Dependencies
# ====================================================================
dependencies:
  tools:
    - name: "SpotBugs"
      version: "4.8.3"
      purpose: "Static analysis for concurrency bugs"

    - name: "SpotBugs Annotations"
      version: "4.8.3"
      purpose: "Custom concurrency detector annotations"

  gradle_dependencies: |
    // build.gradle.kts
    spotbugs("com.github.spotbugs:spotbugs:4.8.3")
    spotbugsPlugins("com.github.spotbugs:spotbugs-annotations:4.8.3")

  required_files:
    - "config/spotbugs/exclude.xml": "SpotBugs exclusion rules"
    - "build.gradle.kts": "SpotBugs configuration"

# ====================================================================
# Concurrency Patterns Detection
# ====================================================================
concurrency_patterns:
  - id: "check-then-act"
    name: "Check-Then-Act (Non-Atomic)"
    description: "Separate check and action operations (e.g., containsKey() then put())"
    severity: "HIGH"
    example_violation: |
      if (map.containsKey(key)) {  // Check
          map.put(key, value);     // Act (non-atomic)
      }
    fix_recommendation: |
      map.putIfAbsent(key, value);  // Atomic operation

  - id: "double-checked-locking"
    name: "Double-Checked Locking"
    description: "Broken double-checked locking pattern (pre-Java 5)"
    severity: "CRITICAL"
    example_violation: |
      if (instance == null) {
          synchronized (this) {
              if (instance == null) {
                  instance = new Singleton();  // ❌ Not volatile
              }
          }
      }
    fix_recommendation: |
      private static volatile Singleton instance;  // ✅ Add volatile

  - id: "unsynchronized-lazy-init"
    name: "Unsynchronized Lazy Initialization"
    description: "Lazy initialization without synchronization"
    severity: "HIGH"
    example_violation: |
      public class Cache {
          private Map<String, Object> cache;
          public Map<String, Object> getCache() {
              if (cache == null) {  // ❌ Race condition
                  cache = new HashMap<>();
              }
              return cache;
          }
      }
    fix_recommendation: |
      // Option 1: Eager initialization
      private final Map<String, Object> cache = new ConcurrentHashMap<>();

      // Option 2: Synchronized lazy init
      public synchronized Map<String, Object> getCache() { }

  - id: "non-atomic-composite-action"
    name: "Non-Atomic Composite Action"
    description: "Multiple operations that should be atomic (e.g., increment)"
    severity: "MEDIUM"
    example_violation: |
      public void increment() {
          count = count + 1;  // ❌ Not atomic
      }
    fix_recommendation: |
      private final AtomicInteger count = new AtomicInteger(0);
      public void increment() {
          count.incrementAndGet();  // ✅ Atomic
      }

  - id: "unsafe-publication"
    name: "Unsafe Publication"
    description: "Object published before fully constructed"
    severity: "HIGH"
    example_violation: |
      public class UnsafePublisher {
          public static UnsafePublisher instance;
          public UnsafePublisher() {
              instance = this;  // ❌ Published before construction complete
              // ... more initialization
          }
      }
    fix_recommendation: |
      // Use factory method with proper initialization order

  - id: "inconsistent-synchronization"
    name: "Inconsistent Synchronization"
    description: "Field accessed with and without synchronization"
    severity: "CRITICAL"
    example_violation: |
      private int count = 0;
      public synchronized void increment() { count++; }
      public int getCount() { return count; }  // ❌ Unsynchronized read
    fix_recommendation: |
      public synchronized int getCount() { return count; }  // ✅ Synchronized

  - id: "wait-not-in-loop"
    name: "Wait Not in Loop"
    description: "Object.wait() not called in a loop (spurious wakeups)"
    severity: "MEDIUM"
    example_violation: |
      synchronized (lock) {
          if (!condition) {  // ❌ Should be while
              lock.wait();
          }
      }
    fix_recommendation: |
      synchronized (lock) {
          while (!condition) {  // ✅ Use while loop
              lock.wait();
          }
      }

  - id: "empty-synchronized-block"
    name: "Empty Synchronized Block"
    description: "Synchronized block with no meaningful operations"
    severity: "LOW"
    example_violation: |
      synchronized (lock) {
          // Empty or only trivial operations
      }
    fix_recommendation: |
      // Remove unnecessary synchronization

# ====================================================================
# Risk Assessment System
# ====================================================================
risk_assessment:
  rating_scale:
    5_stars: "Production-grade (No known issues)"
    4_stars: "Good (Minor improvements possible)"
    3_stars: "Acceptable (Should be improved)"
    2_stars: "Problematic (Must be fixed soon)"
    1_star: "Critical (Fix immediately)"

  formula: |
    Risk Score = (Probability × 0.4) + (Impact × 0.35) + (Actual_Harm × 0.25)

    Where:
    - Probability: 0-10 (How likely to occur in production)
    - Impact: 0-10 (Severity if it occurs)
    - Actual_Harm: 0-10 (Observed harm in production)

  probability_factors:
    - "Concurrency level (thread count)"
    - "Frequency of code execution"
    - "Timing window size"
    - "Load patterns (peak vs normal)"

  impact_factors:
    - "Data corruption risk"
    - "System stability impact"
    - "User experience degradation"
    - "Financial impact"

  actual_harm_factors:
    - "Production incidents observed"
    - "Bug reports related to concurrency"
    - "Monitoring alerts triggered"

# ====================================================================
# SmartAdmin Baseline Audit
# ====================================================================
smartadmin_baseline:
  known_safe_patterns:
    - class: "RepeatSubmitMemoryTicket"
      pattern: "Interner + synchronized"
      rating: "⭐⭐⭐⭐⭐"
      risk: "None"

    - class: "SerialNumberInternService"
      pattern: "Interner + synchronized"
      rating: "⭐⭐⭐⭐⭐"
      risk: "None"

  known_issues:
    - class: "SmartReloadManager"
      method: "register(String tag, SmartReloadObject obj)"
      pattern: "check-then-act"
      issue: "containsKey() then put() - non-atomic"
      risk_level: "⭐⭐ (Low)"
      probability: "<0.01% (startup only, single-threaded Spring init)"
      impact: "Single reload tag overwrite"
      actual_harm: "None observed"
      fix_recommendation: "Use putIfAbsent() for atomic operation"

    - class: "SmartJobScheduler"
      method: "addJob()"
      pattern: "check-then-act"
      issue: "Race condition in job registration"
      risk_level: "⭐ (Very Low)"
      probability: "<0.001%"
      impact: "Acceptable (job duplicate)"
      actual_harm: "None observed"

# ====================================================================
# Input/Output Configuration
# ====================================================================
input:
  required_params:
    - name: "target_package"
      type: "String"
      description: "Package to audit (e.g., 'net.lab1024.sa')"
      default: "net.lab1024.sa"

  optional_params:
    - name: "severity_threshold"
      type: "String"
      description: "Minimum severity to report (LOW, MEDIUM, HIGH, CRITICAL)"
      default: "MEDIUM"

    - name: "include_baseline"
      type: "boolean"
      description: "Include known SmartAdmin baseline patterns"
      default: true

output:
  report_format: "markdown"
  report_path: "docs/quality/concurrency-audit-report.md"

  sections:
    - "Executive Summary (Risk Rating Summary)"
    - "Pattern Detection Results (8 patterns)"
    - "Risk Assessment (⭐⭐⭐⭐⭐ ratings)"
    - "Fix Recommendations (Code examples)"
    - "SmartAdmin Baseline Comparison"
    - "Action Items (Prioritized)"

# ====================================================================
# SpotBugs Integration
# ====================================================================
spotbugs_integration:
  detector_classes:
    - "ConcurrencyPatternDetector"
    - "CheckThenActDetector"
    - "DoubleCheckedLockingDetector"

  bug_patterns:
    - "IS2_INCONSISTENT_SYNC"
    - "UG_SYNC_SET_UNSYNC_GET"
    - "DC_DOUBLECHECK"
    - "LI_LAZY_INIT_STATIC"
    - "WA_NOT_IN_LOOP"
    - "RV_RETURN_VALUE_IGNORED"

  exclude_patterns:
    - "CT_CONSTRUCTOR_THROW"  # Constructor validation is safe
    - "ST_WRITE_TO_STATIC_FROM_INSTANCE_METHOD"  # @PostConstruct pattern

# ====================================================================
# Examples
# ====================================================================
examples:
  - name: "Full Audit"
    trigger: "/concurrency-audit"
    description: "Complete concurrency safety audit"
    expected_output: |
      ✅ Analyzed 127 classes
      ⭐⭐⭐⭐⭐ 5 patterns (Production-grade)
      ⭐⭐⭐⭐ 3 patterns (Good)
      ⚠️ 2 issues found (Low risk)

  - name: "Specific Package"
    trigger: "/concurrency-audit --package net.lab1024.sa.base"
    description: "Audit foundation package only"
    expected_output: "Filtered audit report"

  - name: "High Severity Only"
    trigger: "/concurrency-audit --severity HIGH"
    description: "Report only HIGH and CRITICAL issues"
    expected_output: "Filtered by severity"

# ====================================================================
# Quality Standards
# ====================================================================
quality_standards:
  target_ratings:
    5_stars: "≥ 80%"
    4_stars: "≥ 15%"
    3_stars: "< 5%"
    2_stars: "0%"
    1_star: "0%"

  acceptance_criteria:
    - "No CRITICAL severity issues"
    - "HIGH severity issues < 5"
    - "Risk rating average ≥ 4.0 stars"

# ====================================================================
# References
# ====================================================================
references:
  internal:
    - "rules/check-then-act-detector.xml"
    - "rules/double-checked-locking.xml"
    - "examples/smartreloadmanager-fix.md"
    - "references/concurrency-patterns.md"

  external:
    - name: "Java Concurrency in Practice"
      url: "https://jcip.net/"

    - name: "SpotBugs Bug Patterns"
      url: "https://spotbugs.readthedocs.io/en/stable/bugDescriptions.html"

