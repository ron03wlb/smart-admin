# ====================================================================
# Quality Gate Orchestrator - Skill Configuration
# ====================================================================
# Version: 1.0.0
# Priority: P1 (Important Business Logic - Quality Infrastructure)
# Category: Quality
# Type: Atomic (Orchestrator)
# ====================================================================

metadata:
  name: "quality-gate-orchestrator"
  version: "1.0.0"
  priority: "P1"
  type: "atomic"
  category: "quality"
  description: "Automate quality gates orchestrating ArchUnit, Checkstyle, PMD, SpotBugs, JaCoCo, and SonarQube"
  ai_description: |
    Orchestrates multiple quality tools for comprehensive code quality validation,
    including static analysis, architecture compliance, code coverage, and bug detection.

    Core capabilities:
    - Sequential Quality Checks: Fail-fast validation with execution order optimization
    - Parallel Quality Checks: Multi-threaded execution for faster CI/CD pipelines
    - Pre-merge Validation: Configurable quality gates for pull requests
    - Quality Report Aggregation: Unified HTML/JSON reports from all tools
    - CI/CD Pipeline Generation: GitHub Actions, GitLab CI, Jenkins templates
    - Violation Severity Filtering: Fail on blocker/critical, warn on major/minor

    Orchestrated tools:
    1. Spotless - Auto-formatting (5s)
    2. Checkstyle - Code style compliance (10s)
    3. ArchUnit - Architecture rules validation (15s) - CRITICAL
    4. PMD - Code smell detection (20s)
    5. SpotBugs - Bug pattern detection (30s)
    6. JaCoCo - Code coverage threshold (40s)
    7. SonarQube - Comprehensive quality metrics (optional)

    Execution strategies:
    - Sequential (Fail-Fast): Stop on first failure, ~2 minutes
    - Parallel: Run all checks concurrently, ~40 seconds
    - Hybrid: Critical checks first (ArchUnit), then parallel

    Use when setting up quality gates, pre-commit checks, CI/CD pipelines,
    or generating comprehensive quality reports for SmartAdmin projects.

  tags:
    - "quality-gate"
    - "orchestration"
    - "archunit"
    - "checkstyle"
    - "pmd"
    - "spotbugs"
    - "jacoco"
    - "sonarqube"
    - "static-analysis"
    - "code-quality"

  author: "SmartAdmin Team"
  last_updated: "2026-01-29"
  status: "stable"

triggers:
  keywords:
    - "quality gate"
    - "pre-commit checks"
    - "ArchUnit integration"
    - "Checkstyle pipeline"
    - "PMD automation"
    - "SpotBugs workflow"
    - "SonarQube integration"
    - "code quality checks"
    - "static analysis pipeline"
    - "quality orchestration"
    - "multi-tool validation"
    - "quality report aggregation"

  patterns:
    - "generate.*quality.*gate"
    - "setup.*pre-commit.*checks"
    - "create.*(CI|CD).*quality.*pipeline"
    - "orchestrate.*quality.*tools"

  exclude_keywords:
    - "disable quality gate"
    - "remove quality checks"

execution:
  type: "single-shot"

  timeout:
    per_phase_minutes: 15
    total_minutes: 15

  quality_gates:
    run_after_execution: true
    checks:
      - "compilation"
      - "archunit"  # Self-validation

dependencies:
  skills: []

  required_files:
    - ".agent/rules/quality-tools/11-checkstyle-rules.md"
    - ".agent/rules/quality-tools/12-pmd-rules.md"
    - ".agent/rules/quality-tools/13-spotbugs-rules.md"

  tools:
    - name: "gradle"
      version: ">=8.0"
      required: true

    - name: "checkstyle"
      version: ">=10.0"
      required: true

    - name: "pmd"
      version: ">=7.0"
      required: true

    - name: "spotbugs"
      version: ">=4.8"
      required: true

output:
  generates:
    - "*.gradle.kts"  # Gradle task definitions
    - "*.yml"         # CI/CD pipeline files
    - "*.html"        # Quality reports

  target_directories:
    - "smart-admin-api-java21-springboot3/build/reports/quality"
    - ".github/workflows"
    - ".gitlab-ci.yml"

  templates:
    sequential_task: "assets/qualityGateSequential.gradle.kts"
    parallel_task: "assets/qualityGateParallel.gradle.kts"
    github_actions: "assets/quality-gate.github-actions.yml"
    gitlab_ci: "assets/quality-gate.gitlab-ci.yml"

validation:
  pre_execution:
    - check: "codebase_structure"
      rule: "Must be in SmartAdmin project root"

    - check: "gradle_available"
      rule: "Gradle 8.0+ must be available"
      command: "gradle --version"

    - check: "quality_tools_configured"
      rule: "Checkstyle, PMD, SpotBugs must be configured in build.gradle.kts"

  post_execution:
    - check: "compilation"
      description: "Verify generated quality gate tasks compile"
      command: "./gradlew :smartadmin-app:compileJava"

    - check: "archunit"
      description: "Verify ArchitectureTest passes"
      command: "./gradlew :smartadmin-app:test --tests ArchitectureTest"

compatibility:
  deprecated: false
  deprecation_phase: null
  replacement_skill: null
  migration_guide_url: null
  deprecated_since: null
  removal_date: null

documentation:
  skill_md: "SKILL.md"
  readme: "README.md"
  examples_dir: null
  references_dir: "assets"

  external_links:
    - title: "Checkstyle Rules"
      url: "../../../.agent/rules/quality-tools/11-checkstyle-rules.md"

    - title: "PMD Rules"
      url: "../../../.agent/rules/quality-tools/12-pmd-rules.md"

    - title: "SpotBugs Rules"
      url: "../../../.agent/rules/quality-tools/13-spotbugs-rules.md"

    - title: "ArchUnit Documentation"
      url: "https://www.archunit.org/"

monitoring:
  track_usage: true
  log_executions: true
  metrics:
    - "execution_time"
    - "success_rate"
    - "quality_gates_generated"
    - "tools_orchestrated"
