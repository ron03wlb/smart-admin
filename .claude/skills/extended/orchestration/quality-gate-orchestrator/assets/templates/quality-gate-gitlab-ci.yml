# Quality Gate - GitLab CI/CD
# Location: .gitlab-ci.yml
# Generated by: quality-gate-orchestrator skill

image: gradle:8.11-jdk21

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  COVERAGE_THRESHOLD: "80"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
  - format
  - style
  - architecture
  - analysis
  - coverage
  - sonar

# Stage 1: Code Formatting (non-blocking)
spotless:
  stage: format
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew spotlessCheck --no-daemon
  allow_failure: true
  only:
    - merge_requests
    - main
    - master
    - develop

# Stage 2: Code Style (BLOCKER)
checkstyle:
  stage: style
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:checkstyleMain :smartadmin-app:checkstyleTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: smart-admin-api-java21-springboot3/smartadmin-app/build/reports/checkstyle/*.xml
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/checkstyle/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

# Stage 3: Architecture Rules (BLOCKER)
archunit:
  stage: architecture
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:test --tests "*ArchitectureTest" --no-daemon
  artifacts:
    when: always
    reports:
      junit: smart-admin-api-java21-springboot3/smartadmin-app/build/test-results/test/*.xml
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/tests/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

# Stage 4: Code Quality Analysis (CRITICAL)
pmd:
  stage: analysis
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:pmdMain --no-daemon
  artifacts:
    when: always
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/pmd/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

spotbugs:
  stage: analysis
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:spotbugsMain --no-daemon
  artifacts:
    when: always
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/spotbugs/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

# Stage 5: Test Coverage (MAJOR)
unit-tests:
  stage: coverage
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:test --no-daemon
  artifacts:
    when: always
    reports:
      junit: smart-admin-api-java21-springboot3/smartadmin-app/build/test-results/test/*.xml
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/test-results/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

jacoco-coverage:
  stage: coverage
  script:
    - cd smart-admin-api-java21-springboot3
    - ./gradlew :smartadmin-app:jacocoTestReport --no-daemon
    - ./gradlew :smartadmin-app:jacocoTestCoverageVerification --no-daemon
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: smart-admin-api-java21-springboot3/smartadmin-app/build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/jacoco/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master
    - develop

# Stage 6: SonarQube Analysis (main/master only)
sonarqube:
  stage: sonar
  script:
    - cd smart-admin-api-java21-springboot3
    - |
      ./gradlew :smartadmin-app:sonar \
        -Dsonar.projectKey=smartadmin-v4 \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true \
        --no-daemon
  only:
    - main
    - master
  variables:
    SONAR_HOST_URL: $SONAR_HOST_URL
    SONAR_TOKEN: $SONAR_TOKEN

# Quality Gate Summary (runs after all checks)
quality-gate-summary:
  stage: .post
  script:
    - echo "======================================"
    - echo "🔍 Quality Gate Summary"
    - echo "======================================"
    - echo ""
    - echo "✅ Checkstyle: Code style compliant"
    - echo "✅ ArchUnit: Architecture rules enforced"
    - echo "✅ PMD: No critical code smells"
    - echo "✅ SpotBugs: No bugs detected"
    - echo "✅ Coverage: ≥${COVERAGE_THRESHOLD}%"
    - echo ""
    - echo "View detailed reports in artifacts."
    - echo "======================================"
  when: on_success
  only:
    - merge_requests
    - main
    - master
    - develop

# Optional: Parallel execution (faster but uses more resources)
.parallel-template: &parallel-template
  parallel:
    matrix:
      - TOOL: [checkstyle, pmd, spotbugs]
  script:
    - cd smart-admin-api-java21-springboot3
    - |
      case "$TOOL" in
        checkstyle)
          ./gradlew :smartadmin-app:checkstyleMain --no-daemon
          ;;
        pmd)
          ./gradlew :smartadmin-app:pmdMain --no-daemon
          ;;
        spotbugs)
          ./gradlew :smartadmin-app:spotbugsMain --no-daemon
          ;;
      esac
  artifacts:
    when: always
    paths:
      - smart-admin-api-java21-springboot3/smartadmin-app/build/reports/
    expire_in: 1 week

# Uncomment to enable parallel execution
# quality-gate-parallel:
#   stage: analysis
#   <<: *parallel-template
#   only:
#     - merge_requests

