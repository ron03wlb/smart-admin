# igaming-pm-analyst - Skill Configuration
# Merged from: igame-pm-analyst + igaming-multi-tenant-wallet-pm
# Version: 2.0.0

metadata:
  name: "igaming-pm-analyst"
  version: "2.0.0"
  priority: "P1"
  type: "atomic"
  category: "domain"
  description: "iGaming PM assistant - requirement analysis, PRD generation, multi-tenant architecture, seamless wallet specification, regional compliance"
  tags: ["igaming", "product-management", "prd", "multi-tenant", "seamless-wallet", "compliance"]
  last_updated: "2026-03-07"
  status: "stable"

triggers:
  keywords:
    - "iGame"
    - "包網"
    - "博弈"
    - "遊戲平台"
    - "multi-tenant"
    - "white-label"
    - "seamless wallet"
    - "錢包"
    - "風控"
    - "VIP"
    - "多租戶"

execution:
  type: "phase-based"
  phases: ["requirement-gathering", "multi-tenant-design", "seamless-wallet-design", "regional-compliance"]
  timeout:
    total_minutes: 60

dependencies:
  required_files:
    - "docs/iGame/technical-specs/"
    - ".claude/shared/knowledge/smartadmin-patterns.md"

output:
  generates: ["*.md"]
  target_directories: ["docs/requirements/"]

compatibility:
  deprecated: false
