# iGame需求模式映射表

## 需求類型自動識別與映射

patterns:
  # 資金相關需求
  - keywords: ["餘額", "存款", "充值", "提款", "轉帳", "錢包"]
    category: 資金操作
    priority: P0關鍵
    foundation_modules:
      - P0-01: 雙式記賬架構
      - P0-02: 冪等性架構
      - P0-03: 無縫錢包實現
    architecture_concerns:
      - 資金安全（必須雙式記賬）
      - 併發控制（樂觀鎖/Redis鎖）
      - 冪等性保證（防重複扣款）
      - 審計日誌（完整記錄）
    risk_level: 🔴 高
    required_checks:
      - "是否涉及餘額變更？"
      - "是否可能重複執行？"
      - "併發場景如何處理？"
      - "失敗回滾機制？"

  - keywords: ["VIP", "等級", "升級", "降級", "會員層級"]
    category: 玩家體驗
    priority: P1重要
    foundation_modules:
      - P1-11: VIP系統設計
      - foundation.cache: Redis實時緩存
      - foundation.mq: Kafka事件通知
    architecture_concerns:
      - 事件驅動（升級通知）
      - 實時計算（積分/投注額統計）
      - 緩存策略（當前等級熱數據）
      - 寬限期處理（降級延遲）
    risk_level: 🟡 中
    required_checks:
      - "升級計算邏輯？（存款/投注/活躍）"
      - "是否即時響應？（< 1秒）"
      - "降級寬限期設定？"
      - "併發升級如何處理？"

  - keywords: ["優惠", "獎金", "紅利", "返水", "流水"]
    category: 玩家體驗
    priority: P1重要
    foundation_modules:
      - P1-12: 優惠引擎
      - P0-01: 雙式記賬（優惠也是資金）
      - LiteFlow: 流程編排
    architecture_concerns:
      - 規則引擎（優惠發放條件）
      - 流水計算（投注額追蹤）
      - 遊戲權重（不同遊戲計入比例）
      - FIFO處理（優惠使用順序）
    risk_level: 🔴 高
    required_checks:
      - "優惠類型？（首存/返水/救援金）"
      - "流水要求？（需投注X倍）"
      - "有效期限制？"
      - "與其他優惠衝突規則？"

  - keywords: ["風控", "套利", "異常", "攔截", "欺詐"]
    category: 風險管理
    priority: P1重要
    foundation_modules:
      - P1-06: 實時風控引擎
      - Flink: 流處理
      - foundation.redis_lock: 分佈式鎖
    architecture_concerns:
      - 實時計算（< 100ms響應）
      - 規則引擎（靈活配置風控規則）
      - 行為分析（歷史模式比對）
      - 設備指紋（多帳號關聯）
    risk_level: 🔴 高
    required_checks:
      - "檢測哪些風險？（套利/洗錢/多帳號）"
      - "觸發時機？（下注/提款/註冊）"
      - "處理動作？（攔截/標記/限額）"
      - "誤判容忍度？"

  - keywords: ["遊戲", "供應商", "廠商", "接入", "對接"]
    category: 遊戲聚合
    priority: P1重要
    foundation_modules:
      - P1-09: 遊戲聚合器SDK
      - P0-03: 無縫錢包（API對接）
      - Headless CMS: 遊戲元數據管理
    architecture_concerns:
      - 適配器模式（統一異構API）
      - 元數據同步（遊戲列表/縮圖）
      - 錯誤處理（供應商API失敗）
      - 性能優化（遊戲啟動 < 2s）
    risk_level: 🟡 中
    required_checks:
      - "哪些供應商？（Evolution/Pragmatic）"
      - "對接方式？（API/iframe）"
      - "錢包模式？（轉帳/無縫）"
      - "回調安全驗證？"

  - keywords: ["多租戶", "商戶", "品牌", "白標", "包網"]
    category: 多租戶架構
    priority: P1重要
    foundation_modules:
      - P1-07: 多租戶隔離
      - P1-10: Headless CMS
      - Snail-Job: 執行器組隔離
    architecture_concerns:
      - 數據隔離（tenant_id行級）
      - 資源隔離（獨立執行器）
      - 配置隔離（Logo/主題/規則）
      - 性能隔離（租戶A不影響租戶B）
    risk_level: 🔴 高
    required_checks:
      - "隔離等級？（共享DB/獨立DB）"
      - "配置差異？（前端主題/業務規則）"
      - "資源限制？（QPS限流/存儲配額）"
      - "數據遷移需求？"

  - keywords: ["報表", "統計", "分析", "儀表板", "數據"]
    category: 運營分析
    priority: P1重要
    foundation_modules:
      - P1-13: 報表與分析
      - Apache Doris: OLAP引擎
      - Kafka: 數據流管道
    architecture_concerns:
      - 冷熱分離（OLTP vs OLAP）
      - 物化視圖（預計算聚合）
      - 查詢優化（分區/索引）
      - 延遲容忍度（秒級可接受）
    risk_level: 🟢 低
    required_checks:
      - "報表類型？（財務/玩家/代理）"
      - "查詢頻率？（即時/每日/每月）"
      - "數據保留期？（3個月/1年/永久）"
      - "自定義需求？（拖拽配置/固定模板）"

  - keywords: ["KYC", "認證", "實名", "身份驗證", "AML"]
    category: 合規管理
    priority: P0關鍵
    foundation_modules:
      - P0-04: KYC/AML自動化
      - LiteFlow: 審核流程編排
      - MinIO: 文檔存儲
    architecture_concerns:
      - 漸進式驗證（等級0-3）
      - 第三方集成（Jumio/Onfido）
      - 文檔存儲（身份證/地址證明）
      - 審計留存（監管要求）
    risk_level: 🔴 高
    required_checks:
      - "驗證等級？（手機/身份證/視訊）"
      - "觸發時機？（註冊/提款/達額度）"
      - "第三方供應商？"
      - "人工審核流程？"

  - keywords: ["加密貨幣", "虛擬貨幣", "BTC", "ETH", "USDT", "區塊鏈"]
    category: 加密支付
    priority: P1重要
    foundation_modules:
      - P1-08: 加密貨幣支付網關
      - P0-01: 雙式記賬
      - P0-02: 冪等性
    architecture_concerns:
      - HD錢包（BIP32/BIP44）
      - 冷熱錢包隔離（90%/10%）
      - 區塊鏈監聽（確認數）
      - 自動歸集（Gas費優化）
    risk_level: 🔴 高
    required_checks:
      - "支持幣種？（BTC/ETH/USDT）"
      - "確認數要求？（1/3/6）"
      - "提款審核機制？（自動/人工）"
      - "冷錢包管理？（多重簽名/MPC）"

  - keywords: ["性能", "優化", "慢查詢", "併發", "壓力測試"]
    category: 技術優化
    priority: P1重要
    foundation_modules:
      - P1-14: 性能優化
      - foundation.cache: 多級緩存
      - Redis Cluster: 分佈式緩存
    architecture_concerns:
      - 緩存策略（Caffeine L1 + Redis L2）
      - 數據庫優化（索引/分區/分片）
      - 異步處理（Kafka削峰填谷）
      - JVM調優（G1GC/ZGC）
    risk_level: 🟡 中
    required_checks:
      - "性能瓶頸？（DB/緩存/網路）"
      - "目標指標？（TPS/QPS/延遲）"
      - "壓測場景？（峰值/持續）"
      - "降級策略？"

  - keywords: ["安全", "漏洞", "XSS", "SQL注入", "CSRF"]
    category: 安全防護
    priority: P1重要
    foundation_modules:
      - P1-15: 安全強化
      - foundation.api_encrypt: API加密
      - foundation.security_protect: 安全防護
    architecture_concerns:
      - OWASP Top 10緩解
      - API加密傳輸
      - 防重放攻擊
      - MFA多因素認證
    risk_level: 🔴 高
    required_checks:
      - "已知漏洞？（SonarQube掃描）"
      - "敏感數據？（需加密存儲）"
      - "認證機制？（JWT/OAuth2）"
      - "合規要求？（等保/ISO27001）"

## 優先級判定規則

priority_rules:
  P0_critical:
    conditions:
      - 涉及資金安全（存提款/結算）
      - 影響合規性（KYC/AML）
      - 系統核心功能（錢包/登錄）
    characteristics:
      - 生產環境啟動前必須完成
      - 無此功能系統無法運營
      - 資金/數據安全的數學保證

  P1_important:
    conditions:
      - 核心業務功能（VIP/優惠/風控）
      - 競爭差異化（遊戲聚合/多租戶）
      - 運營必需（報表/配置）
    characteristics:
      - 競爭市場定位所需
      - 運營效率關鍵功能
      - 玩家體驗核心要素

  P2_enhancement:
    conditions:
      - 體驗優化（通知/i18n）
      - 管理工具（排程作業/文件存儲）
      - 高級功能（A/B測試/玩家分群）
    characteristics:
      - 競爭差異化因素
      - 運營效率提升
      - Nice to have但非必需

## 架構決策映射

architecture_decisions:
  需要強一致性:
    scenarios:
      - 錢包餘額變更
      - 訂單狀態流轉
      - 風控決策記錄
    solution: PostgreSQL事務 + 樂觀鎖

  可接受最終一致性:
    scenarios:
      - 遊戲日誌
      - 排行榜
      - 統計報表
    solution: Kafka + ClickHouse + 物化視圖

  需要實時計算:
    scenarios:
      - VIP等級評估
      - 優惠流水進度
      - 風控評分
    solution: Flink流處理 + Redis緩存

  需要規則引擎:
    scenarios:
      - 優惠發放條件
      - 風控攔截規則
      - VIP升級邏輯
    solution: LiteFlow流程編排

  需要分佈式鎖:
    scenarios:
      - 併發扣款
      - 優惠領取
      - VIP升級
    solution: Redisson分佈式鎖

  需要異步處理:
    scenarios:
      - 大批量數據導入
      - 郵件/簡訊發送
      - 報表生成
    solution: Kafka消息隊列 + 消費者

## 風險識別矩陣

risk_matrix:
  資金安全風險:
    triggers:
      - 關鍵詞包含"餘額/存款/提款/轉帳"
      - 涉及資金數值計算
      - 需要資料庫寫入餘額表
    mandatory_checks:
      - "是否實現雙式記賬？"
      - "是否保證冪等性？"
      - "併發如何處理？"
      - "失敗回滾機制？"
      - "審計日誌是否完整？"
    mitigation:
      - 必須使用P0-01雙式記賬架構
      - 必須使用P0-02冪等性架構
      - 使用樂觀鎖/Redis鎖
      - 實現Saga補償機制

  性能風險:
    triggers:
      - 預期TPS > 1000
      - 涉及複雜查詢/聚合
      - 高併發寫入場景
    mandatory_checks:
      - "預期併發量？"
      - "是否需要緩存？"
      - "數據庫索引優化？"
      - "是否需要異步處理？"
    mitigation:
      - 引入Redis多級緩存
      - 數據庫分區/分片
      - Kafka削峰填谷
      - 冷熱數據分離

  合規風險:
    triggers:
      - 關鍵詞包含"KYC/AML/監管"
      - 涉及個人敏感資訊
      - 需要審計留存
    mandatory_checks:
      - "監管機構要求？"
      - "數據保留期限？"
      - "跨境數據傳輸？"
      - "審計日誌規格？"
    mitigation:
      - PII加密存儲
      - 完整審計日誌
      - GDPR合規設計
      - 定期合規審查
