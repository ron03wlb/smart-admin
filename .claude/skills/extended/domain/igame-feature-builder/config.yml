# igaming-feature-builder - Skill Configuration
# Merged from: igame-feature-builder + fraud-detection-pattern-generator
# Version: 2.0.0

metadata:
  name: "igaming-feature-builder"
  version: "2.0.0"
  priority: "P1"
  type: "atomic"
  category: "domain"
  description: "Implement iGaming features (VIP, Wallet, Bonus, Fraud detection, Risk control) with financial precision and compliance"
  tags: ["igaming", "vip-system", "wallet", "bonus-engine", "fraud-detection", "compliance"]
  last_updated: "2026-03-07"
  status: "stable"

triggers:
  keywords:
    - "VIP tier"
    - "wallet deposit"
    - "wallet withdrawal"
    - "bonus distribution"
    - "fraud detection"
    - "risk control"
    - "bonus abuse"
    - "multi-account"
    - "KYC automation"
    - "AML"

execution:
  type: "single-shot"
  timeout:
    total_minutes: 20
  quality_gates:
    run_after_execution: true
    checks: ["compilation", "unit-tests"]

dependencies:
  required_files:
    - "docs/iGame/technical-specs/"

output:
  generates: ["*.java", "*.sql"]

compatibility:
  deprecated: false
