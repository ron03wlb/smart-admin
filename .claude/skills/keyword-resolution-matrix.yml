# ====================================================================
# Keyword Conflict Resolution Matrix v2.0.0
# ====================================================================
# Purpose: Priority-based routing for conflicting keywords
# Last Updated: 2026-03-07
# ====================================================================

schema_version: "2.0.0"

conflict_groups:

  # Group 1: Testing Keywords
  testing_group:
    keywords: ["test", "testing", "unit test", "integration test"]
    skills:
      - skill: "smartadmin-integration-test"
        priority: 1
        trigger_patterns: ["integration test", "testcontainers", "database test"]
      - skill: "test-fixture-generator"
        priority: 2
        trigger_patterns: ["test data", "test fixture", "test builder"]
      - skill: "archunit-test-generator"
        priority: 3
        trigger_patterns: ["architecture test", "ArchUnit"]
    resolution_rule: |
      1. "architecture" OR "ArchUnit" → archunit-test-generator
      2. "integration" OR "testcontainers" → smartadmin-integration-test
      3. "test data" OR "fixture" → test-fixture-generator

  # Group 2: Refactoring Keywords
  refactoring_group:
    keywords: ["refactor", "refactoring", "extract"]
    skills:
      - skill: "smartadmin-manager-extractor"
        priority: 1
        trigger_patterns: ["extract to Manager", "@Transactional violation"]
      - skill: "vavr-refactoring-assistant"
        priority: 2
        trigger_patterns: ["vavr", "Option", "Try", "Either"]
    resolution_rule: |
      1. "Manager" OR "@Transactional" → smartadmin-manager-extractor
      2. "Vavr" OR "Option" OR "Try" → vavr-refactoring-assistant

  # Group 3: Quality Keywords
  quality_group:
    keywords: ["quality", "check", "validate", "audit"]
    skills:
      - skill: "concurrency-safety-auditor"
        priority: 1
        trigger_patterns: ["thread safety", "race condition", "concurrent", "deadlock"]
      - skill: "spring-pattern-checker"
        priority: 2
        trigger_patterns: ["@Transactional", "Spring pattern", "DI pattern"]
      - skill: "naming-convention-checker"
        priority: 3
        trigger_patterns: ["naming", "convention check", "class name", "table name"]
    resolution_rule: |
      1. "thread" OR "concurrent" OR "deadlock" → concurrency-safety-auditor
      2. "@Transactional" OR "Spring" OR "DI" → spring-pattern-checker
      3. "naming" OR "convention" → naming-convention-checker

  # Group 4: iGaming Keywords
  igaming_group:
    keywords: ["igaming", "igame", "博弈", "包網"]
    skills:
      - skill: "igaming-pm-analyst"
        priority: 1
        trigger_patterns: ["需求分析", "PRD", "multi-tenant", "seamless wallet", "compliance"]
      - skill: "igaming-feature-builder"
        priority: 2
        trigger_patterns: ["VIP tier", "wallet deposit", "bonus", "fraud detection"]
    resolution_rule: |
      1. "PRD" OR "需求" OR "multi-tenant" OR "compliance" → igaming-pm-analyst
      2. "VIP" OR "wallet" OR "bonus" OR "fraud" → igaming-feature-builder
