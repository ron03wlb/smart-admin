# ====================================================================
# Cache Strategy Generator - Skill Configuration
# ====================================================================
# Version: 1.0.0
# Priority: P2 (Nice-to-have Tools)
# Category: Infrastructure
# Type: Atomic
# ====================================================================

metadata:
  name: "cache-strategy-generator"
  version: "1.0.0"
  priority: "P2"
  type: "atomic"
  category: "infrastructure"
  description: "Generate multi-level caching strategies (Caffeine L1 + Redis L2) with cache-aside, write-through patterns"
  tags: ["caching", "redis", "caffeine", "performance"]
  author: "SmartAdmin Team"
  last_updated: "2026-01-29"
  status: "stable"

triggers:
  keywords: ["caching", "slow queries", "Redis cache", "Caffeine", "cache invalidation"]
  patterns: ["add.*cache", "implement.*caching"]
  exclude_keywords: ["remove cache"]

execution:
  type: "single-shot"
  timeout: { per_phase_minutes: 20, total_minutes: 20 }
  quality_gates: { run_after_execution: true }

dependencies: { skills: [], required_files: [], tools: [] }
output: { generates: ["*.java"], target_directories: ["smart-admin-api-java21-springboot3/sa-admin/src/main/java"], templates: {} }
validation: { pre_execution: [{ check: "codebase_structure" }], post_execution: [{ check: "compilation" }] }
compatibility: { deprecated: false }
documentation: { skill_md: "SKILL.md", readme: null }
monitoring: { track_usage: true, log_executions: true, metrics: ["execution_time", "success_rate"] }
