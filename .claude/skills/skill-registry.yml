# ====================================================================
# Dependency Graph (Topological Order)
# ====================================================================
dependency_graph:
  # No dependencies (Tier 0)
  tier_0:
    - archunit-test-generator
    - security-hardening-pro
    - vavr-refactoring-assistant
    - liteflow-rule-builder
    - fraud-detection-pattern-generator
    - quality-gate-orchestrator
    - naming-convention-checker
    - igame-pm-analyst
    - igaming-multi-tenant-wallet-pm
    - apm-integration
    - cicd-pipeline-builder
    - db-migration-manager
    - full-text-search-integration
    - i18n-generator
    - message-queue-pattern-generator
    - report-generator
    - scheduled-task-manager
    - websocket-sse-realtime-generator
    - java-performance-pro
    - markdown-quality-checker

  # Single dependency (Tier 1)
  tier_1:
    - smartadmin-crud-generator  # depended by: batch-plan-executor, igame-feature-builder
    - smartadmin-integration-test  # depended by: smartadmin-testing-suite
    - test-fixture-generator  # depended by: smartadmin-testing-suite, smartadmin-crud-generator
    - cache-strategy-generator  # depended by: smartadmin-performance-suite

  # Multiple dependencies (Tier 2)
  tier_2:
    - igame-feature-builder  # depends on: smartadmin-crud-generator
    - smartadmin-performance-suite  # depends on: java-performance-pro, cache-strategy-generator, apm-integration
    - smartadmin-testing-suite  # depends on: smartadmin-integration-test, test-fixture-generator

  # Orchestrators (Tier 3)
  tier_3:
    - batch-plan-executor  # depends on: smartadmin-crud-generator, liteflow-rule-builder, smartadmin-testing-suite, smartadmin-performance-suite

# ====================================================================
# Conflict Resolution Rules
# ====================================================================
conflicts:
  - skills: ["smartadmin-mybatis", "smartadmin-crud-generator"]
    resolution: "prefer smartadmin-crud-generator"
    reason: "mybatis is deprecated"

  - skills: ["smartadmin-vue-crud", "smartadmin-crud-generator"]
    resolution: "prefer smartadmin-crud-generator"
    reason: "vue-crud is deprecated"

  - skills: ["smartadmin-api-docs", "smartadmin-crud-generator"]
    resolution: "prefer smartadmin-crud-generator"
    reason: "api-docs is deprecated"

  - skills: ["java-performance-pro", "smartadmin-performance-suite"]
    resolution: "prefer smartadmin-performance-suite"
    reason: "performance-suite consolidates java-performance-pro"

  - skills: ["cache-strategy-generator", "smartadmin-performance-suite"]
    resolution: "prefer smartadmin-performance-suite"
    reason: "performance-suite consolidates cache-strategy-generator"

  - skills: ["apm-integration", "smartadmin-performance-suite"]
    resolution: "prefer smartadmin-performance-suite"
    reason: "performance-suite consolidates apm-integration"

  - skills: ["smartadmin-integration-test", "smartadmin-testing-suite"]
    resolution: "prefer smartadmin-testing-suite"
    reason: "testing-suite consolidates integration-test"

  - skills: ["test-fixture-generator", "smartadmin-testing-suite"]
    resolution: "prefer smartadmin-testing-suite"
    reason: "testing-suite consolidates test-fixture-generator"

