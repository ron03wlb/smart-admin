# ====================================================================
# Keyword Conflict Resolution
# ====================================================================
conflict_resolution:
  matrix_file: "keyword-resolution-matrix.yml"
  strategy: "priority_first"
  description: |
    Resolves conflicts when multiple skills share the same keywords:
    - performance: 3 skills (performance-suite, postgresql, java-performance-pro)
    - test: 4 skills (testing-suite, integration-test, fixture-generator, archunit)
    - refactor: 2 skills (manager-extractor, vavr-refactoring-assistant)

# ====================================================================
# Dependency Management Guidelines
# ====================================================================
#
# SINGLE SOURCE OF TRUTH: depends_on
#
# Skills declare dependencies using TWO fields:
# - depends_on: AUTHORITATIVE (what this skill depends on)
# - depended_by: DERIVED (auto-calculated from reverse dependencies)
#
# CRITICAL RULES:
# 1. Always update 'depends_on' when adding dependencies
# 2. The 'depended_by' field is for documentation only
# 3. Validation script enforces consistency between both fields
#
# To validate dependencies:
#   $ python3 .claude/scripts/validate-dependency-graph.py
#
# ====================================================================

