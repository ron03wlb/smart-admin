    - apm-integration-skill
    - cicd-pipeline-builder
    - db-migration-manager
    - full-text-search-integration
    - i18n-generator
    - message-queue-pattern-generator
    - report-generator-skill
    - scheduled-task-manager
    - websocket-sse-realtime-generator
    - java-performance-pro

  # Single dependency (Tier 1)
  tier_1:
    - smartadmin-crud-generator  # depended by: batch-plan-executor, igame-feature-builder
    - smartadmin-integration-test  # depended by: smartadmin-testing-suite
    - test-fixture-generator  # depended by: smartadmin-testing-suite, smartadmin-crud-generator
    - cache-strategy-generator  # depended by: smartadmin-performance-suite

  # Multiple dependencies (Tier 2)
  tier_2:
    - igame-feature-builder  # depends on: smartadmin-crud-generator
    - smartadmin-performance-suite  # depends on: java-performance-pro, cache-strategy-generator, apm-integration-skill
    - smartadmin-testing-suite  # depends on: smartadmin-integration-test, test-fixture-generator

  # Orchestrators (Tier 3)
  tier_3:
    - batch-plan-executor  # depends on: smartadmin-crud-generator, liteflow-rule-builder, smartadmin-testing-suite, smartadmin-performance-suite

