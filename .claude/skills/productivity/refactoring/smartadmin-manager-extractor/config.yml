# ====================================================================
# SmartAdmin Manager Extractor Skill Configuration
# ====================================================================
# Version: 1.0.0
# Created: 2026-01-29
# Priority: P2 (Productivity/Refactoring)
# Type: Atomic
# Category: Refactoring
# ====================================================================

metadata:
  name: "smartadmin-manager-extractor"
  version: "1.0.0"
  priority: "P2"
  type: "atomic"
  category: "refactoring"
  visibility: "public"
  preferred_via: "user_invoked"
  status: "stable"

  description: |
    Automatically extract @Transactional methods from Service layer to Manager layer,
    ensuring compliance with SmartAdmin architectural rules enforced by ArchUnit.

    Purpose:
    - Fix ArchUnit violations: "transactionalMustUseRollbackForThrowable" and "@Transactional must be in Manager layer"
    - Reduce manual refactoring time: 30 minutes → 5 minutes (83% improvement)
    - Ensure architectural consistency

    Process:
    1. Parse Service class with JavaParser
    2. Identify @Transactional methods
    3. Generate Manager class from template (if not exists)
    4. Extract methods to Manager (preserve dependencies)
    5. Update Service to call Manager
    6. Triple validation: Compile + ArchUnit + Tests
    7. Git safe rollback on failure

  aliases:
    - "manager-extract"
    - "extract-to-manager"
    - "refactor-transaction"
    - "fix-transactional-violation"

  tags:
    - refactoring
    - manager-layer
    - transaction
    - archunit
    - javaparser
    - ast

# ====================================================================
# Trigger Configuration
# ====================================================================
triggers:
  keywords:
    - "extract to Manager"
    - "transactionalMustUseRollbackForThrowable fails"
    - "refactor transaction"
    - "@Transactional must be in Manager"
    - "move method to Manager"
    - "ArchUnit violation"

  patterns:
    - "extract .* to Manager"
    - "fix transactional.*violation"
    - "move.*transaction.*Manager"

  archunit_violations:
    - "transactionalMustUseRollbackForThrowable"
    - "transactionalMustBeInManagerLayer"
    - "serviceMustNotUseTransactional"

# ====================================================================
# Execution Configuration
# ====================================================================
execution:
  type: "single-shot"
  timeout_minutes: 15
  requires_confirmation: true
  safe_mode: true  # Always create Git stash before operation

  phases:
    - id: "phase-1-parse"
      name: "Parse Service Class"
      description: "Use JavaParser to analyze Service class structure"
      output: "List of @Transactional methods with dependencies"

    - id: "phase-2-generate-manager"
      name: "Generate Manager Class"
      description: "Create Manager class from template if not exists"
      output: "Generated Manager.java file"

    - id: "phase-3-extract-methods"
      name: "Extract Methods"
      description: "Move @Transactional methods to Manager layer"
      output: "Updated Service and Manager classes"

    - id: "phase-4-validate"
      name: "Triple Validation"
      description: "Compile + ArchUnit + Tests"
      output: "Validation report (pass/fail)"

    - id: "phase-5-rollback"
      name: "Rollback on Failure"
      description: "Git stash pop if validation fails"
      output: "Restored to original state"
      conditional: true

# ====================================================================
# Dependencies
# ====================================================================
dependencies:
  tools:
    - name: "JavaParser"
      version: "3.26.0"
      purpose: "Parse and manipulate Java AST"

    - name: "ArchUnit"
      version: "1.3.0"
      purpose: "Validate architectural rules"

  gradle_dependencies: |
    // Add to build.gradle.kts (if not already present):
    testImplementation("com.tngtech.archunit:archunit-junit5:1.3.0")
    implementation("com.github.javaparser:javaparser-core:3.26.0")

  required_files:
    - "ArchitectureTest.java": "Contains ArchUnit rules"
    - "SmartAdmin Service classes": "Source files for extraction"

# ====================================================================
# Input/Output Configuration
# ====================================================================
input:
  required_params:
    - name: "service_class"
      type: "String"
      description: "Service class name (e.g., 'EmployeeService')"
      example: "EmployeeService"

  optional_params:
    - name: "method_names"
      type: "List<String>"
      description: "Specific method names to extract (default: all @Transactional methods)"
      default: "all"

    - name: "target_manager"
      type: "String"
      description: "Target Manager class name (default: {ServiceName}Manager)"
      default: "auto-generated"

    - name: "dry_run"
      type: "boolean"
      description: "Preview changes without applying"
      default: false

output:
  generated_files:
    - "Manager.java": "Generated Manager class"
    - "Service.java": "Updated Service class"

  reports:
    - "extraction-report.md": "Summary of extracted methods"
    - "validation-report.md": "ArchUnit + Test results"

  metrics:
    - "methods_extracted": "Number of methods moved to Manager"
    - "dependencies_updated": "Number of Service methods updated"
    - "time_saved": "Estimated manual refactoring time saved"

# ====================================================================
# Extraction Rules
# ====================================================================
extraction_rules:
  identification:
    - annotation: "@Transactional"
      action: "extract_to_manager"

    - annotation: "@Cacheable"
      priority: "higher_than_transactional"
      action: "extract_to_manager"
      note: "If both @Cacheable and @Transactional, @Cacheable takes priority"

  edge_cases:
    - name: "Interdependent Methods"
      condition: "Service method calls another @Transactional method"
      solution: "Extract all dependent methods together"

    - name: "Manager Name Conflict"
      condition: "Manager class already has method with same name"
      solution: "Rename to {methodName}Transaction()"

    - name: "Private Methods"
      condition: "@Transactional on private method"
      solution: "Convert to package-private before extraction"

    - name: "Field Dependencies"
      condition: "Method uses Service fields"
      solution: "Inject dependencies via Manager constructor"

  naming_conventions:
    manager_class: "{ServiceName}Manager"
    manager_method: "{originalMethodName}" or "{originalMethodName}Transaction()" (if conflict)
    service_delegate_method: "Delegates to Manager.{managerMethodName}()"

# ====================================================================
# Validation Strategy
# ====================================================================
validation:
  steps:
    - id: "compile"
      description: "Ensure code compiles"
      command: "./gradlew compileJava"
      failure_action: "rollback"

    - id: "archunit"
      description: "Verify ArchUnit rules pass"
      command: "./gradlew :sa-admin:test --tests ArchitectureTest"
      failure_action: "rollback"

    - id: "unit_tests"
      description: "Ensure tests pass"
      command: "./gradlew :sa-admin:test"
      failure_action: "rollback"
      allow_failure: false

  failure_recovery:
    - "Git stash pop to restore original state"
    - "Log detailed error message"
    - "Provide manual fix suggestions"

# ====================================================================
# Git Safety
# ====================================================================
git_safety:
  pre_execution:
    - "git stash push -u -m 'Pre-Manager-Extraction: {ServiceName}'"

  post_execution_success:
    - "git add {Service.java} {Manager.java}"
    - "git commit -m 'refactor({module}): extract @Transactional to Manager\n\n- Extracted {methods_extracted} methods to {ManagerName}\n- Fixed ArchUnit violations\n- All tests passing\n\nRefs: ArchitectureTest'"

  post_execution_failure:
    - "git stash pop"
    - "echo 'Rollback completed. See error log for details.'"

# ====================================================================
# Examples
# ====================================================================
examples:
  - name: "Extract All @Transactional Methods"
    trigger: "/manager-extract EmployeeService"
    description: "Extract all @Transactional methods from EmployeeService"
    expected_output: |
      ✅ Created EmployeeManager.saveEmployeeTransaction()
      ✅ Updated EmployeeService to call Manager
      ✅ Compile: PASSED
      ✅ ArchUnit: PASSED
      ✅ Tests: PASSED

  - name: "Extract Specific Method"
    trigger: "/manager-extract EmployeeService --method saveEmployee"
    description: "Extract only saveEmployee() method"
    expected_output: "EmployeeManager.saveEmployeeTransaction() created"

  - name: "Dry Run (Preview)"
    trigger: "/manager-extract EmployeeService --dry-run"
    description: "Preview changes without applying"
    expected_output: "Preview report showing proposed changes"

  - name: "Fix ArchUnit Violation"
    trigger: "ArchUnit test failed: EmployeeService.saveEmployee() violates @Transactional rule"
    description: "AI automatically suggests using /manager-extract"
    expected_output: "Automatic extraction with validation"

# ====================================================================
# Templates
# ====================================================================
templates:
  manager_class:
    path: "templates/Manager.java.template"
    variables:
      - "MANAGER_CLASS_NAME": "Generated from {ServiceName}Manager"
      - "SERVICE_DEPENDENCIES": "Extracted from Service constructor"
      - "PACKAGE": "Same package as Service"

  service_delegate_method:
    pattern: |
      public ReturnType methodName(Parameters params) {
          return managerInstance.methodNameTransaction(params);
      }

# ====================================================================
# Quality Standards
# ====================================================================
quality_standards:
  archunit_compliance: true
  test_coverage: "≥ 80%"
  time_saving: "≥ 80% (30 min → 5 min)"

# ====================================================================
# References
# ====================================================================
references:
  internal:
    - "examples/extraction-example.md"
    - "references/manager-layer-patterns.md"
    - "templates/Manager.java.template"

  external:
    - name: "JavaParser Documentation"
      url: "https://javaparser.org/"

    - name: "ArchUnit User Guide"
      url: "https://www.archunit.org/userguide/html/000_Index.html"

  smartadmin_rules:
    - ".agent/rules/foundation/10-architecture-rules.md"
    - ".agent/rules/foundation/09-manager-layer.md"

# ====================================================================
# END OF CONFIG
# ====================================================================
