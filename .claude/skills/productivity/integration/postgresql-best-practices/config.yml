# ====================================================================
# PostgreSQL Best Practices Skill Configuration
# ====================================================================
# Version: 1.0.0
# Created: 2026-01-29
# Priority: P2 (Productivity)
# Type: Atomic
# Category: Integration
# ====================================================================

metadata:
  name: "postgresql-best-practices"
  version: "1.0.0"
  priority: "P2"
  type: "atomic"
  category: "integration"
  visibility: "public"
  preferred_via: "user_invoked"
  status: "stable"

  description: |
    PostgreSQL performance analysis and optimization skill for SmartAdmin projects.

    Capabilities:
    1. HikariCP Connection Pool Analysis - Analyze pool utilization and recommend optimal settings
    2. N+1 Query Detection - Parse P6Spy logs to identify N+1 query patterns
    3. EXPLAIN ANALYZE Automation - Run EXPLAIN ANALYZE on slow queries and parse results
    4. Index Recommendations - Analyze pg_stat_user_tables to suggest missing indexes

    Output: Comprehensive performance report (Markdown) with actionable recommendations

  aliases:
    - "postgres-analyze"
    - "database-performance"
    - "hikaricp-tuning"
    - "n1-detection"

  tags:
    - postgresql
    - performance
    - database
    - hikaricp
    - optimization
    - n+1-query
    - index

# ====================================================================
# Trigger Configuration
# ====================================================================
triggers:
  keywords:
    - "database performance"
    - "PostgreSQL optimization"
    - "HikariCP tuning"
    - "N+1 query detection"
    - "slow query analysis"
    - "connection pool"
    - "index recommendation"

  patterns:
    - "analyze database performance"
    - "optimize PostgreSQL"
    - "tune HikariCP settings"
    - "detect N+1 queries"

# ====================================================================
# Execution Configuration
# ====================================================================
execution:
  type: "single-shot"
  timeout_minutes: 10
  requires_confirmation: true

  modes:
    full:
      description: "Complete performance analysis (all 4 capabilities)"
      default: true

    hikaricp-only:
      description: "HikariCP connection pool analysis only"

    n1-detection:
      description: "N+1 query detection from P6Spy logs"

    explain-analyze:
      description: "EXPLAIN ANALYZE on specific SQL queries"

    index-recommendations:
      description: "Index recommendation based on table statistics"

  phases:
    - id: "phase-1-hikaricp"
      name: "HikariCP Analysis"
      description: "Analyze connection pool utilization via HikariPoolMXBean"
      output: "HikariCP tuning recommendations"

    - id: "phase-2-n1-detection"
      name: "N+1 Query Detection"
      description: "Parse P6Spy logs to identify N+1 patterns"
      output: "List of detected N+1 query patterns with SQL"

    - id: "phase-3-explain-analyze"
      name: "EXPLAIN ANALYZE"
      description: "Run EXPLAIN ANALYZE on slow queries"
      output: "Query execution plans with performance metrics"

    - id: "phase-4-index-recommendations"
      name: "Index Recommendations"
      description: "Query pg_stat_user_tables for index suggestions"
      output: "CREATE INDEX statements for recommended indexes"

# ====================================================================
# Dependencies
# ====================================================================
dependencies:
  tools:
    - name: "HikariCP"
      version: "5.0.1"
      purpose: "Connection pool monitoring via MXBean"

    - name: "P6Spy"
      version: "3.9.1"
      purpose: "SQL statement logging and N+1 detection"

    - name: "PostgreSQL JDBC"
      version: "42.7.0"
      purpose: "EXPLAIN ANALYZE execution"

    - name: "Testcontainers"
      version: "1.19.3"
      purpose: "Integration testing with PostgreSQL 16"

  gradle_dependencies: |
    // Add to build.gradle.kts dependencies block:
    runtimeOnly("com.p6spy:p6spy:3.9.1")
    testImplementation("org.testcontainers:postgresql:1.19.3")

  spring_boot_config: |
    # Required configuration in application.yml:
    spring:
      datasource:
        url: jdbc:p6spy:postgresql://localhost:5432/smartadmin
        driver-class-name: com.p6spy.engine.spy.P6SpyDriver
        hikari:
          minimum-idle: 2
          maximum-pool-size: 10
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
          pool-name: SmartAdminHikariPool

# ====================================================================
# Input/Output Configuration
# ====================================================================
input:
  required_params:
    - name: "datasource"
      type: "DataSource"
      description: "Spring Boot DataSource bean for HikariCP monitoring"

    - name: "p6spy_log_path"
      type: "Path"
      description: "Path to P6Spy log file (optional, for N+1 detection)"
      default: "logs/spy.log"

  optional_params:
    - name: "slow_query_threshold_ms"
      type: "int"
      description: "Queries slower than this will be analyzed"
      default: 1000

    - name: "target_schemas"
      type: "List<String>"
      description: "PostgreSQL schemas to analyze"
      default: ["public"]

output:
  report_format: "markdown"
  report_path: "docs/performance/postgresql-performance-report.md"

  sections:
    - "Executive Summary"
    - "HikariCP Connection Pool Analysis"
    - "N+1 Query Detection Results"
    - "EXPLAIN ANALYZE Reports"
    - "Index Recommendations"
    - "Action Items (Prioritized)"

# ====================================================================
# Quality Standards
# ====================================================================
quality_standards:
  hikaricp_utilization:
    optimal_range: [0.5, 0.8]
    warning_threshold: 0.9
    action_threshold: 0.95

  n1_query_detection:
    pattern: "Same SQL template executed > 10 times within 100ms"
    severity: "HIGH"

  index_recommendations:
    min_seq_scan_count: 100
    priority_by_scan_count: true

# ====================================================================
# Examples
# ====================================================================
examples:
  - name: "Full Analysis"
    trigger: "/postgres-analyze"
    description: "Run complete performance analysis"
    expected_output: "Comprehensive report with all 4 sections"

  - name: "HikariCP Only"
    trigger: "/postgres-analyze --mode hikaricp-only"
    description: "Analyze connection pool only"
    expected_output: "HikariCP tuning recommendations"

  - name: "N+1 Detection"
    trigger: "/postgres-analyze --mode n1-detection --log logs/spy.log"
    description: "Detect N+1 queries from P6Spy logs"
    expected_output: "List of N+1 patterns with SQL"

# ====================================================================
# References
# ====================================================================
references:
  internal:
    - "examples/hikaricp-tuning-example.md"
    - "references/postgres-best-practices.md"
    - "templates/performance-report.md.template"

  external:
    - name: "HikariCP Best Practices"
      url: "https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing"

    - name: "PostgreSQL EXPLAIN"
      url: "https://www.postgresql.org/docs/current/sql-explain.html"

    - name: "P6Spy Configuration"
      url: "https://p6spy.readthedocs.io/en/latest/configandusage.html"

# ====================================================================
# END OF CONFIG
# ====================================================================
