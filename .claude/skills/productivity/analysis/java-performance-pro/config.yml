# ====================================================================
# Java Performance Pro - Skill Configuration
# ====================================================================
# Version: 1.0.0
# Priority: P2 (Nice-to-have Tools)
# Category: Analysis
# Type: Atomic
# ====================================================================

metadata:
  name: "java-performance-pro"
  version: "1.0.0"
  priority: "P2"
  type: "atomic"
  category: "analysis"
  description: "Profile and optimize Java application performance including N+1 query detection, JVM memory tuning, CPU hotspot analysis"
  ai_description: |
    Profiles Java applications and optimizes performance bottlenecks with focus on
    MyBatis Plus N+1 queries, JVM tuning, cache optimization, and SQL performance.

    Core capabilities:
    - N+1 Query Detection: Identify and fix MyBatis Plus N+1 patterns
    - JVM Memory Tuning: Heap size, GC strategy, memory leak detection
    - CPU Hotspot Analysis: Method profiling, thread contention
    - Redis Cache Optimization: Cache hit ratio, TTL tuning
    - SQL Query Performance: Slow query analysis, index recommendations

  tags: ["performance", "profiling", "n+1", "jvm", "optimization"]
  author: "SmartAdmin Team"
  last_updated: "2026-01-29"
  status: "stable"

triggers:
  keywords: ["slow", "performance", "optimize", "N+1", "memory leak", "CPU usage", "cache miss", "query optimization"]
  patterns: ["profile.*performance", "optimize.*endpoint"]
  exclude_keywords: []

execution:
  type: "single-shot"
  timeout: { per_phase_minutes: 15, total_minutes: 15 }
  quality_gates: { run_after_execution: false }

dependencies: { skills: [], required_files: [], tools: [] }
output: { generates: ["*.md", "*.java"], target_directories: ["docs/performance", "smart-admin-api-java21-springboot3/sa-admin/src/main/java"], templates: {} }
validation: { pre_execution: [{ check: "codebase_structure" }], post_execution: [] }
compatibility:
  deprecated: false
  soft_deprecated: true
  replacement_skill: "smartadmin-performance-suite"
  migration_date: "2026-01-27"
documentation: { skill_md: "SKILL.md", readme: null }
monitoring: { track_usage: true, log_executions: true, metrics: ["execution_time", "success_rate"] }
