# ====================================================================
# SmartAdmin Performance Suite - Skill Configuration
# ====================================================================
# Version: 2.0.0
# Priority: P2 (Nice-to-have Tools)
# Category: Composite
# Type: Composite (Mode-based)
# ====================================================================

metadata:
  name: "smartadmin-performance-suite"
  version: "2.0.0"
  priority: "P2"
  type: "composite"
  category: "composite"
  description: "Comprehensive performance suite with integrated diagnose → optimize → monitor workflow"
  ai_description: |
    Unified performance optimization solution providing integrated diagnose → optimize → monitor
    workflow for SmartAdmin applications. Consolidates java-performance-pro, cache-strategy-generator,
    and apm-integration into a single orchestrator.

    Modes:
    - diagnose: N+1 detection, JVM tuning, CPU hotspots, SQL slow queries
    - optimize: Multi-level caching (Caffeine L1 + Redis L2)
    - monitor: Skywalking, Micrometer, Grafana dashboards
    - workflow: Complete diagnose → optimize → monitor cycle (default)

  tags: ["performance", "optimization", "monitoring", "caching", "n+1", "jvm"]
  author: "SmartAdmin Team"
  last_updated: "2026-01-29"
  status: "stable"

triggers:
  keywords: ["slow", "performance", "optimize", "monitoring", "APM", "cache", "N+1", "Grafana"]
  patterns: ["optimize.*performance", "slow.*endpoint"]
  exclude_keywords: []

execution:
  type: "mode-based"
  modes:
    - id: "diagnose"
      name: "Diagnose Performance Issues"
      file: "modes/mode-1-diagnose.md"
      estimated_minutes: 10
    - id: "optimize"
      name: "Optimize with Caching"
      file: "modes/mode-2-optimize.md"
      estimated_minutes: 12
    - id: "monitor"
      name: "Setup Monitoring"
      file: "modes/mode-3-monitor.md"
      estimated_minutes: 8
    - id: "workflow"
      name: "Complete Workflow"
      file: "modes/mode-workflow.md"
      estimated_minutes: 30
  timeout: { per_phase_minutes: 15, total_minutes: 60 }
  quality_gates: { run_after_execution: true }

dependencies:
  skills: []
  consolidated_from:
    - java-performance-pro
    - cache-strategy-generator
    - apm-integration

output: { generates: ["*.java"], target_directories: ["smart-admin-api-java21-springboot3/smartadmin-app/src/main/java"], templates: {} }
validation: { pre_execution: [{ check: "codebase_structure" }], post_execution: [{ check: "compilation" }] }
compatibility: { deprecated: false }
documentation: { skill_md: "SKILL.md", readme: null }
monitoring: { track_usage: true, log_executions: true, metrics: ["execution_time", "modes_executed"] }
