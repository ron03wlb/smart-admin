# =============================================
# Smart Admin 21 - Redis 配置
# =============================================

# 網絡
bind 0.0.0.0
port 6379
protected-mode no

# 通用
daemonize no
databases 16

# 持久化（RDB）
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 持久化（AOF）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 內存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日誌
loglevel notice

# 慢查詢日誌
slowlog-log-slower-than 10000
slowlog-max-len 128

# 客戶端
timeout 0
tcp-keepalive 300

# 安全（如需密碼，取消下行註釋）
# requirepass your_redis_password
