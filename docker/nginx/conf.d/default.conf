# =============================================
# Smart Admin 21 - Nginx 站點配置
# =============================================

# 上游服務定義 - 僅後端 API
upstream backend_api {
    server host.docker.internal:8080;
    keepalive 32;
}

# 主服務器配置
server {
    listen 80;
    server_name localhost;

    # Docker DNS 解析器（用於動態解析前端容器）
    resolver 127.0.0.11 valid=30s;

    # 健康檢查端點
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API 代理 - 後端服務
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # 標頭設置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超時設置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 緩衝設置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # WebSocket 支持（如需要）
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 前端靜態資源（當前端容器運行時）
    # 使用變量延遲解析，避免啟動時報錯
    location / {
        set $frontend_upstream sa21-web:3000;
        
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 開發服務器熱重載支持
        proxy_read_timeout 86400;
        
        # 如果前端容器未運行，返回提示頁面
        error_page 502 503 = @frontend_not_running;
    }

    # 前端未運行時的提示頁面
    location @frontend_not_running {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Smart Admin 21</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
               display: flex; justify-content: center; align-items: center; 
               height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .container { text-align: center; padding: 60px; background: white; 
                     border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                     max-width: 500px; }
        h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .emoji { font-size: 4em; margin-bottom: 20px; }
        p { color: #666; font-size: 1.1em; line-height: 1.6; }
        code { background: #f0f0f0; padding: 4px 12px; border-radius: 6px; 
               font-family: monospace; font-size: 0.9em; }
        a { color: #667eea; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .hint { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🚀</div>
        <h1>Smart Admin 21</h1>
        <p>後端 API 服務已就緒</p>
        <p>前端服務尚未啟動</p>
        <div class="hint">
            <p>啟動前端：<code>docker compose --profile frontend up -d</code></p>
            <p>或直接訪問：<a href="http://localhost:3000">http://localhost:3000</a></p>
        </div>
    </div>
</body>
</html>';
    }

    # 錯誤頁面
    error_page 500 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
