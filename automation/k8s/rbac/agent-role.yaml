# SmartAdmin Auto-Coding - Kubernetes RBAC Configuration
# Version: 1.0.0
# Author: SmartAdmin Auto-Coding System
# Date: 2026-01-27

---
# 1. ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartadmin-agent
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: agent

---
# 2. Role: smartadmin-agent-base (基礎權限)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartadmin-agent-base
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
rules:
# Pod 讀取權限
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]  # 僅讀取，不允許 delete/update

# ConfigMap 讀取權限
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]  # 僅讀取

# Secret 受限讀取（僅指定名稱）
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "claude-api-credentials"
    - "telegram-bot-credentials"
  verbs: ["get"]  # 僅讀取指定 Secret

---
# 3. Role: smartadmin-agent-workflow (Argo Workflows 權限)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartadmin-agent-workflow
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
rules:
# Argo Workflow 權限
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflowtemplates"]
  verbs: ["get", "list", "create"]  # 可創建，不能 delete

---
# 4. Role: smartadmin-agent-audit (PostgreSQL 訪問)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartadmin-agent-audit
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
rules:
# PostgreSQL Service 訪問
- apiGroups: [""]
  resources: ["services"]
  resourceNames: ["postgres"]
  verbs: ["get"]

---
# 5. RoleBinding: smartadmin-agent-base
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartadmin-agent-base-binding
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
subjects:
- kind: ServiceAccount
  name: smartadmin-agent
  namespace: smartadmin
roleRef:
  kind: Role
  name: smartadmin-agent-base
  apiGroup: rbac.authorization.k8s.io

---
# 6. RoleBinding: smartadmin-agent-workflow
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartadmin-agent-workflow-binding
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
subjects:
- kind: ServiceAccount
  name: smartadmin-agent
  namespace: smartadmin
roleRef:
  kind: Role
  name: smartadmin-agent-workflow
  apiGroup: rbac.authorization.k8s.io

---
# 7. RoleBinding: smartadmin-agent-audit
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartadmin-agent-audit-binding
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: rbac
subjects:
- kind: ServiceAccount
  name: smartadmin-agent
  namespace: smartadmin
roleRef:
  kind: Role
  name: smartadmin-agent-audit
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================================
# Security Constraints Documentation
# ============================================================================
#
# ❌ NEVER grant the following dangerous permissions:
#
# 1. Pod modification/deletion
#    - pods: delete, deletecollection, patch, update
#
# 2. Unrestricted Secret access
#    - secrets: create, delete, update
#    - secrets: get/list (without resourceNames)
#
# 3. Workflow deletion
#    - workflows: delete, deletecollection
#
# 4. Namespace-level permissions
#    - namespaces: * (any operation)
#
# 5. Cluster-level permissions
#    - clusterroles, clusterrolebindings: * (any operation)
#
# 6. Node operations
#    - nodes: * (any operation)
#
# ============================================================================
