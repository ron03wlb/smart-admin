# SmartAdmin Auto-Coding - Telegram Webhook Deployment
# Version: 1.0.0

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-webhook
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: telegram-webhook
spec:
  replicas: 2  # High availability: 2 replicas
  selector:
    matchLabels:
      app: smartadmin-auto-coding
      component: telegram-webhook
  template:
    metadata:
      labels:
        app: smartadmin-auto-coding
        component: telegram-webhook
    spec:
      serviceAccountName: smartadmin-agent
      containers:
      - name: webhook
        image: smartadmin/telegram-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # Telegram Bot configuration (from Secret)
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-bot-credentials
              key: bot-token
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: telegram-bot-credentials
              key: chat-id
        # Log level
        - name: LOG_LEVEL
          value: "INFO"
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        # Resource limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: telegram-webhook
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: telegram-webhook
spec:
  type: ClusterIP
  selector:
    app: smartadmin-auto-coding
    component: telegram-webhook
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telegram-webhook-hpa
  namespace: smartadmin
  labels:
    app: smartadmin-auto-coding
    component: telegram-webhook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telegram-webhook
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
