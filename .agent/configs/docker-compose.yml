services:
  # PostgreSQL 16 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: smartadmin-postgres
    environment:
      POSTGRES_DB: smart_admin_v3
      POSTGRES_USER: smartadmin
      POSTGRES_PASSWORD: SmartAdmin@2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartadmin -d smart_admin_v3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartadmin-network
    restart: unless-stopped

  # Redis 7 缓存服务
  redis:
    image: redis:7-alpine
    container_name: smartadmin-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass SmartAdmin@2024
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartadmin-network
    restart: unless-stopped

  # pgAdmin 管理工具（可选）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartadmin-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartadmin.local
      PGADMIN_DEFAULT_PASSWORD: SmartAdmin@2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - smartadmin-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools  # 使用 --profile tools 启动

  # 开发环境后端应用（可选）
  app:
    build:
      context: ../../smart-admin-api-java21-springboot3
      dockerfile: Dockerfile.dev
    container_name: smartadmin-app
    ports:
      - "1024:1024"  # 应用端口
      - "5005:5005"  # Debug 端口
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_admin_v3?useSSL=false
      SPRING_DATASOURCE_USERNAME: smartadmin
      SPRING_DATASOURCE_PASSWORD: SmartAdmin@2024

      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: SmartAdmin@2024

      # JVM 配置
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
    volumes:
      - ../../smart-admin-api-java21-springboot3:/app:cached
      - maven_cache:/root/.m2
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1024/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - smartadmin-network
    restart: unless-stopped
    profiles:
      - app  # 使用 --profile app 启动

volumes:
  postgres_data:
    driver: local
    name: smartadmin_postgres_data
  redis_data:
    driver: local
    name: smartadmin_redis_data
  pgadmin_data:
    driver: local
    name: smartadmin_pgadmin_data
  maven_cache:
    driver: local
    name: smartadmin_maven_cache
  app_logs:
    driver: local
    name: smartadmin_app_logs

networks:
  smartadmin-network:
    driver: bridge
    name: smartadmin_network
