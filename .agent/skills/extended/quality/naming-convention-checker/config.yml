name: naming-convention-checker
version: "2.0.0"
priority: P1
category: quality
status: stable
description: "Validate SmartAdmin naming conventions"

rules:
  classes:
    controller: "{Name}Controller"
    service: "{Name}Service"
    manager: "{Name}Manager"
    dao: "{Name}Dao"
    entity: "{Name}Entity"

  forms:
    add: "{Name}AddForm"
    update: "{Name}UpdateForm"
    query: "{Name}QueryForm"

  response:
    vo: "{Name}VO"

  tables:
    pattern: "t_{name}"
    form: "singular"

  boolean_fields:
    allowed: "deleted, enabled, visible"
    forbidden: "isDeleted, isEnabled, isVisible"

related_rules:
  - "foundation/F01-naming-conventions.md"
