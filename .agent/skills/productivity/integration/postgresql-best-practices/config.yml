name: postgresql-best-practices
version: "2.0.0"
priority: P2
category: integration
status: stable
description: "PostgreSQL 效能分析與優化"

output_language: "繁體中文"

when_to_use:
  - "資料庫連線超時"
  - "HikariCP 調優"
  - "慢查詢分析"
  - "N+1 查詢檢測"
  - "索引優化"

analysis_modes:
  - "full: 完整分析"
  - "hikaricp-only: 僅連線池"
  - "n1-detection: 僅 N+1 檢測"
  - "explain-analyze: 僅執行計劃"

tools_used:
  - "HikariCP Metrics"
  - "P6Spy"
  - "pg_stat_user_tables"
  - "EXPLAIN ANALYZE"

outputs:
  - "調優建議"
  - "N+1 模式清單"
  - "執行計劃分析"
  - "CREATE INDEX 語句"
