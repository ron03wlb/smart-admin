name: markdown-quality-checker
version: "2.0.0"
priority: P2
category: refactoring
status: stable
description: "Markdown/Mermaid 品質檢查與修復"

output_language: "繁體中文"

when_to_use:
  - "文檔品質審查"
  - "Mermaid 圖表驗證"
  - "連結檢查"
  - "CI/CD 文檔檢查"

check_categories:
  mermaid:
    - "語法驗證"
    - "閉合標籤"
    - "節點連接"
  links:
    - "內部連結"
    - "錨點存在性"
    - "外部連結"
  formatting:
    - "標題層級"
    - "代碼區塊"
    - "列表格式"

severity_levels:
  - "error: 必須修復"
  - "warning: 建議修復"
  - "info: 可選改進"

outputs:
  - "品質報告"
  - "修復建議"
  - "自動修復"
