name: smartadmin-performance-suite
version: "2.0.0"
priority: P2
category: composite
status: stable
description: "效能優化套件 (診斷 → 優化 → 監控)"

output_language: "繁體中文"

when_to_use:
  - "效能問題診斷"
  - "系統瓶頸分析"
  - "快取策略優化"
  - "APM 監控設置"

modes:
  diagnose:
    description: "效能診斷"
    outputs:
      - "N+1 查詢報告"
      - "JVM 分析報告"
      - "CPU 熱點報告"
  optimize:
    description: "效能優化"
    outputs:
      - "快取配置"
      - "查詢優化"
      - "索引建議"
  monitor:
    description: "效能監控"
    outputs:
      - "APM 配置"
      - "Grafana 儀表板"
      - "告警規則"

consolidates:
  - "cache-strategy-generator"
  - "postgresql-best-practices"
  - "apm-integration"
