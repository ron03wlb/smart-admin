# SmartAdmin Integration Test Configuration
name: smartadmin-integration-test
version: "2.0.0"
priority: P0
category: full-stack
status: stable

description: "Generate Spring Boot integration tests with Testcontainers"

when_to_use:
  - "Need database integration tests"
  - "Testing with real PostgreSQL/Redis containers"
  - "Validating API endpoints end-to-end"

containers:
  - name: PostgreSQL
    image: "postgres:15"
    purpose: "Database testing"

  - name: Redis
    image: "redis:7"
    purpose: "Cache testing"

test_annotations:
  - "@SpringBootTest"
  - "@Testcontainers"
  - "@ActiveProfiles('test')"
  - "@Transactional"

related_rules:
  - "quality-tools/Q06-jacoco-coverage-rules.md"
