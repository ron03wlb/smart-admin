# Security Hardening Pro Configuration
name: security-hardening-pro
version: "2.0.0"
priority: P0
category: backend
status: stable

description: "Implement security best practices (SM2/SM3/SM4, data masking, XSS/CSRF)"

when_to_use:
  - "Implementing encryption"
  - "Adding XSS/CSRF protection"
  - "Need audit logging"
  - "Implementing data masking"

security_features:
  encryption:
    - SM2 (Asymmetric)
    - SM3 (Hash)
    - SM4 (Symmetric)

  data_protection:
    - Phone masking
    - ID card masking
    - Email masking

  web_security:
    - XSS prevention
    - CSRF protection
    - SQL injection prevention
    - Security headers

related_rules:
  - "security/S01-owasp-top10-part1.md"
  - "security/S02-owasp-top10-part2.md"
