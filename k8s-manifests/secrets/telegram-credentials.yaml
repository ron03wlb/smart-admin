---
# Telegram Bot 憑證配置
# 使用方式：
# 1. 在 Telegram 中搜索 @BotFather
# 2. 發送 /newbot 創建新 Bot
# 3. 獲取 Bot Token（格式: 123456789:ABCdefGHIjklMNOpqrsTUVwxyz）
# 4. 在 Telegram 中搜索你的 Bot 並發送 /start
# 5. 訪問 https://api.telegram.org/bot<YOUR_BOT_TOKEN>/getUpdates 獲取 Chat ID
# 6. 替換下面的 <YOUR_BOT_TOKEN> 和 <YOUR_CHAT_ID>
# 7. 部署: kubectl apply -f telegram-credentials.yaml

apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot-credentials
  namespace: smartadmin
  labels:
    app: smartadmin-ai
    component: telegram
type: Opaque
stringData:
  # 替換為你的實際 Bot Token
  bot-token: "<YOUR_BOT_TOKEN>"  # 從 @BotFather 獲取

  # 替換為你的實際 Chat ID
  chat-id: "<YOUR_CHAT_ID>"      # 從 /getUpdates API 獲取

---
# 使用說明：
# 1. 創建 Telegram Bot 步驟：
#    - 在 Telegram 搜索 @BotFather
#    - 發送 /newbot
#    - 設置 Bot 名稱（例如：SmartAdmin AI Notifier）
#    - 設置用戶名（例如：smartadmin_ai_bot）
#    - 記錄 Bot Token
#
# 2. 獲取 Chat ID 步驟：
#    - 在 Telegram 搜索你的 Bot 並發送 /start
#    - 瀏覽器訪問：https://api.telegram.org/bot<YOUR_BOT_TOKEN>/getUpdates
#    - 查找 JSON 中的 "chat":{"id":123456789}
#    - 記錄 Chat ID
#
# 3. 部署 Secret：
#    kubectl apply -f telegram-credentials.yaml
#
# 4. 驗證部署：
#    kubectl get secret telegram-bot-credentials -n smartadmin
#    kubectl describe secret telegram-bot-credentials -n smartadmin
#
# 5. 測試發送消息：
#    curl -X POST "https://api.telegram.org/bot<YOUR_BOT_TOKEN>/sendMessage" \
#      -H "Content-Type: application/json" \
#      -d '{"chat_id": "<YOUR_CHAT_ID>", "text": "Test message from SmartAdmin AI"}'
