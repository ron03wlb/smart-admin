---
# Claude API 憑證配置
# 使用方式：
# 1. 訪問 https://console.anthropic.com/ 獲取 API Key
# 2. 替換下面的 <YOUR_CLAUDE_API_KEY>
# 3. 部署: kubectl apply -f claude-api-credentials.yaml

apiVersion: v1
kind: Secret
metadata:
  name: claude-api-credentials
  namespace: smartadmin
  labels:
    app: smartadmin-ai
    component: llm
type: Opaque
stringData:
  # 替換為你的實際 Claude API Key
  api-key: "<YOUR_CLAUDE_API_KEY>"  # 從 https://console.anthropic.com/ 獲取

  # Claude API Base URL（通常不需要修改）
  base-url: "https://api.anthropic.com"

  # 默認模型配置
  default-model: "claude-sonnet-4.5"
  fallback-model: "claude-haiku-3.5"

---
# 使用說明：
# 1. 獲取 Claude API Key：
#    - 訪問 https://console.anthropic.com/
#    - 登錄並進入 API Keys 頁面
#    - 創建新 API Key 或使用現有 Key
#    - 記錄 Key（格式：sk-ant-...）
#
# 2. 驗證 API Key：
#    curl https://api.anthropic.com/v1/messages \
#      -H "x-api-key: $CLAUDE_API_KEY" \
#      -H "anthropic-version: 2023-06-01" \
#      -H "content-type: application/json" \
#      -d '{"model": "claude-sonnet-4.5", "max_tokens": 1024, "messages": [{"role": "user", "content": "Hello"}]}'
#
# 3. 部署 Secret：
#    kubectl apply -f claude-api-credentials.yaml
#
# 4. 驗證部署：
#    kubectl get secret claude-api-credentials -n smartadmin
#    kubectl describe secret claude-api-credentials -n smartadmin
#
# 5. 在 Pod 中使用：
#    env:
#    - name: CLAUDE_API_KEY
#      valueFrom:
#        secretKeyRef:
#          name: claude-api-credentials
#          key: api-key
